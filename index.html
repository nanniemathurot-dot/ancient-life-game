<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Dynasty Life Simulator - Comprehensive Epic Edition</title>
    <style>
        :root {
            --primary: #7b1113;
            --primary-dark: #4a090a;
            --gold: #c5a059;
            --gold-light: #fdfbf7;
            --bg-main: #f4f1ea;
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --border-color: #dcd6c8;
            --danger-red: #a93226;
            --success-green: #1e8449;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto; font-size: 14px; }

        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-y: auto;
        }
        .setup-card {
            background: #fff; width: 100%; max-width: 450px; border-radius: 18px; padding: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5); border-top: 6px solid var(--gold); text-align: center; max-height: 90vh; overflow-y: auto;
        }
        .setup-card h2 { color: var(--primary); margin-bottom: 8px; font-size: 20px; font-weight: bold; }
        .setup-card p { font-size: 13px; color: #666; margin-bottom: 16px; }
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 4px; }
        .form-control { width: 100%; padding: 11px 12px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
        .btn-start {
            width: 100%; background: linear-gradient(135deg, var(--gold), #9a7b38); color: #fff;
            border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(197,160,89,0.4); margin-top: 14px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--gold-light); padding: 10px 14px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 3px 12px rgba(0,0,0,0.3); z-index: 25;
            border-bottom: 2px solid var(--gold); height: 56px; position: sticky; top: 0; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .menu-btn { background: none; border: none; color: var(--gold); font-size: 26px; cursor: pointer; }
        .avatar-box { font-size: 26px; background: rgba(255,255,255,0.15); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--gold); }
        .header-info h1 { font-size: 14px; color: var(--gold); font-weight: bold; }
        .header-info p { font-size: 11px; color: #fff; opacity: 0.95; }
        .header-right { text-align: right; font-size: 11px; color: var(--gold-light); line-height: 1.3; }

        .mini-stats-bar {
            background: #fff; padding: 8px 12px; display: flex; justify-content: space-around;
            border-bottom: 1px solid var(--border-color); font-size: 12px; font-weight: bold; color: #333; z-index: 24; position: sticky; top: 56px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .mini-stat { display: flex; align-items: center; gap: 4px; }

        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; display: none; backdrop-filter: blur(2px); }
        .drawer-overlay.active { display: block; }
        .left-drawer { position: fixed; top: 0; left: -290px; width: 290px; height: 100%; background: #fff; z-index: 101; box-shadow: 6px 0 25px rgba(0,0,0,0.4); transition: left 0.3s ease; display: flex; flex-direction: column; }
        .left-drawer.active { left: 0; }
        .drawer-header { background: var(--primary); color: var(--gold); padding: 16px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 14px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .drawer-btn { background: #fdfbf7; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: left; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .drawer-btn:hover { background: var(--gold-light); color: var(--primary); border-color: var(--gold); }

        main { flex-grow: 1; padding: 12px 14px 120px 14px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); border: 1px solid #e8e2d0; }
        .card h3 { font-size: 15px; color: var(--primary); margin-bottom: 12px; border-bottom: 1.5px solid #eee; padding-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .sub-menu-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px dashed var(--border-color); }
        .sub-tab { background: #faf8f2; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; color: #555; }
        .sub-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 6px; }
        .btn-action { 
            background: linear-gradient(135deg, #ffffff, #faf8f2); 
            border: 1.5px solid var(--border-color); 
            border-left: 4px solid var(--primary);
            color: var(--text-dark); 
            padding: 12px 16px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: left; 
            font-size: 13px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s ease; 
        }
        .btn-action:hover { background: var(--gold-light); border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(123,17,19,0.15); }
        .btn-action:hover .feature-note { color: var(--primary); opacity: 0.9; }
        .feature-note { font-size: 11px; color: #666; font-weight: normal; background: rgba(0,0,0,0.04); padding: 3px 6px; border-radius: 4px; width: fit-content; }

        .chronicle-item { background: #faf8f2; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 8px; font-size: 12px; line-height: 1.7; color: #333; }
        .chronicle-year { font-weight: bold; color: var(--primary); margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; }

        .advance-container { position: fixed; bottom: 60px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 15; pointer-events: none; padding: 6px 0; background: linear-gradient(to top, rgba(244,241,234,0.95), transparent); }
        .btn-advance { pointer-events: auto; background: linear-gradient(135deg, var(--gold), #9a7b38); color: #fff; border: none; padding: 12px 36px; border-radius: 30px; font-weight: bold; font-size: 15px; box-shadow: 0 5px 18px rgba(197,160,89,0.5); cursor: pointer; border: 1.5px solid #fff; }
        .btn-advance:active { transform: scale(0.95); }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 58px; background: #fff; border-top: 1.5px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 20; flex-shrink: 0; }
        .nav-item { background: none; border: none; font-size: 11px; color: #666; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; flex-grow: 1; padding: 4px 0; font-weight: 600; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 20px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 200; display: none; justify-content: center; align-items: center; backdrop-filter: blur(3px); padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; border-top: 6px solid var(--primary); max-height: 85vh; overflow-y: auto; }
        .modal-box h2 { color: var(--primary); margin-bottom: 10px; font-size: 18px; font-weight: bold; }
        .modal-box p { font-size: 13px; margin-bottom: 16px; color: #333; line-height: 1.6; text-align: left; }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-card">
            <h2>📜 มหากาพย์ราชวงศ์ต้าเซี่ย</h2>
            <p>เลือกชะตากรรมจุดเริ่มต้นเพื่อจารึกตำนานชีวิตของคุณ</p>
            
            <div class="form-group">
                <label>นามสกุลตระกูล:</label>
                <input type="text" id="input-surname" class="form-control" value="มู่หรง">
            </div>
            <div class="form-group">
                <label>ชื่อจริง:</label>
                <input type="text" id="input-firstname" class="form-control" value="เฟิ่ง">
            </div>
            <div class="form-group">
                <label>เพศตัวละคร:</label>
                <select id="input-gender" class="form-control">
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง" selected>หญิง</option>
                </select>
            </div>
            <div class="form-group">
                <label>พล็อตจุดเริ่มต้นชะตากรรม:</label>
                <select id="input-status-choice" class="form-control">
                    <option value="ขุนนาง">👑 บุตรขุนนางตระกูลใหญ่ (สายบุ๋นผู้สูงศักดิ์)</option>
                    <option value="แม่ทัพ">⚔️ ทายาทตระกูลแม่ทัพ (สายบู๊สงครามชายแดน)</option>
                    <option value="วังหลัง">🌸 โฉมงามตระกูลสูง (สายโรแมนติก & ชิงอำนาจวังหลัง)</option>
                    <option value="ทาส">⛓️ ทาสรับใช้ในจวน (สายดราม่าไถ่ตัวจากจุดต่ำสุด)</option>
                    <option value="ตกอับ">⚠️ ทายาทขุนนางถูกใส่ร้าย (สายล้างมลทินกู้ชื่อเสียง)</option>
                    <option value="พ่อค้า">💰 ทายาทคหบดีใหญ่ (สายเศรษฐีเงินหนาค้าขาย)</option>
                </select>
            </div>
            <button class="btn-start" onclick="initGameSession()">🚀 เริ่มต้นมหากาพย์ชีวิต (อายุ 0 ปี)</button>
        </div>
    </div>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
            <div class="avatar-box" id="header-avatar">👶</div>
            <div class="header-info">
                <h1 id="header-name">มู่หรง เฟิ่ง</h1>
                <p id="header-dynasty">ราชวงศ์ต้าเซี่ย | บทที่ 1</p>
            </div>
        </div>
        <div class="header-right">
            <div id="header-season">🌸 ฤดูใบไม้ผลิ</div>
            <div id="header-age">อายุ 0 ปี</div>
        </div>
    </header>

    <div class="mini-stats-bar">
        <div class="mini-stat">💰 เงิน: <span id="bar-money">300</span></div>
        <div class="mini-stat">📖 ปัญญา: <span id="bar-intel">10</span></div>
        <div class="mini-stat">⚔️ ยุทธ์: <span id="bar-combat">5</span></div>
        <div class="mini-stat">🌸 เสน่ห์: <span id="bar-charm">10</span></div>
        <div class="mini-stat">🌟 ชื่อเสียง: <span id="bar-prestige">0</span></div>
    </div>

    <!-- แถบเมนูด้านซ้าย: แยกเป็นสถานที่และสำนักพิเศษนอกเมือง ไม่ซ้ำกับหน้าจอหลักเด็ดขาด -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
    <div class="left-drawer" id="left-drawer">
        <div class="drawer-header">
            <span>⛩️ สำนักพิเศษ & สถานที่นอกเมือง</span>
            <span style="cursor:pointer; font-size:18px;" onclick="toggleDrawer(false)">✕</span>
        </div>
        <div class="drawer-body">
            <button class="drawer-btn" onclick="openMarketModal()">🛒 ตลาดมืดการค้า & อัญมณีโบราณ</button>
            <button class="drawer-btn" onclick="openHospitalModal()">💊 สำนักหมอหลวง & ซื้อยาโสมบำรุง</button>
            <button class="drawer-btn" onclick="openFortuneModal()">🔮 สำนักหมอดูฮวงจุ้ยทำนายดวงชะตา</button>
            <button class="drawer-btn" onclick="openChronicleFullModal()">📜 อ่านสมุดจดพงศาวดารฉบับเต็ม</button>
            <button class="drawer-btn" onclick="saveGameManually()">💾 บันทึกเกมทันที</button>
            <button class="drawer-btn" onclick="location.reload()">🔄 รีเฟรชหน้าจอ</button>
            <button class="drawer-btn" onclick="resetGame()" style="color: var(--danger-red);">🔄 เริ่มเกมใหม่ทั้งหมด</button>
        </div>
    </div>

    <main id="main-content"></main>

    <div class="advance-container">
        <button class="btn-advance" onclick="advanceYear()">⏳ ผ่านไป 1 ปี (อายุ +1)</button>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchTab('life')" id="nav-life"><span class="nav-icon">📖</span>เรื่องราวชีวิต</button>
        <button class="nav-item" onclick="switchTab('career')" id="nav-career"><span class="nav-icon">🏛️</span>ราชสำนัก/อาชีพ</button>
        <button class="nav-item" onclick="switchTab('family')" id="nav-family"><span class="nav-icon">🏠</span>จวนตระกูล</button>
        <button class="nav-item" onclick="switchTab('training')" id="nav-training"><span class="nav-icon">🏮</span>ฝึกฝนทักษะ</button>
    </nav>

    <div class="modal-overlay" id="game-modal">
        <div class="modal-box">
            <h2 id="modal-title">แจ้งเตือน</h2>
            <p id="modal-desc">...</p>
            <button class="btn-primary" id="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        let game = {
            surname: "มู่หรง",
            firstname: "เฟิ่ง",
            gender: "หญิง",
            pathType: "ขุนนาง",
            isFramed: false,
            isEmperor: false,
            age: 0,
            year: 1,
            health: 100,
            money: 300,
            seasonIndex: 0,
            seasons: ["🌸 ฤดูใบไม้ผลิ", "☀️ ฤดูร้อน", "🍂 ฤดูใบไม้ร่วง", "❄️ ฤดูหนาว"],
            career: "ทารกแบเบาะในจวน",
            careerRank: "ยังไม่บรรลุนิติภาวะ",
            careerLevel: 1,
            careerExp: 0,
            stats: { intelligence: 10, combat: 5, charm: 10, prestige: 0 },
            skills: { guqin: 5, chess: 5, calligraphy: 5, painting: 5 },
            family: { 
                mansionLevel: 1, 
                servants: 3, 
                guards: 0, 
                granary: 0, 
                libraryLevel: 0, 
                guestHouse: 0, 
                connection: 20,
                spouse: "โสด", 
                spouseAffection: 50,
                concubines: [],
                heirs: []
            },
            workplace: { bossFavor: 30, rivalName: "อัครเสนาบดีจ้าว" },
            chronicleLog: [],
            currentTab: "life",
            careerSubTab: "sub1"
        };

        const childhoodStories = [
            "ถือกำเนิดลืมตาดูโลกในคฤหาสน์ตระกูล เสียงประทัดจุดเฉลิมฉลองดังไปทั่วทั้งตรอกเมืองหลวง บิดามารดาทุ่มเทความรักดูแลทะนุถนอมเป็นอย่างดี",
            "อายุ 1 ปี เริ่มก้าวเดินและพูดคำแรกได้อย่างน่าเอ็นดู ฮูหยินใหญ่ผู้เป็นมารดาคอยสอนสั่งมารยาทพื้นฐานในเรือนบ่าวรับใช้",
            "อายุ 2 ปี เติบโตขึ้นด้วยสุขภาพที่แข็งแรง มีโอกาสได้เดินเที่ยวเล่นในสวนหินของจวน เริ่มแสดงความฉลาดเฉลียวให้เห็น",
            "อายุ 3 ปี เริ่มฝึกคัดตัวอักษรจีนพู่กันจีนโบราณ บิดาว่าจ้างอาจารย์พิเศษมาสอนหนังสือที่เรือนหนังสือ",
            "อายุ 4 ปี ได้เรียนรู้บทกลอนโบราณและประวัติศาสตร์ราชวงศ์ต้าเซี่ย ความทรงจำดีเยี่ยมจนอาจารย์ประธานคำชม",
            "อายุ 5 ปี เริ่มฝึกสุนทรียภาพทางศิลปะ ทั้งการฟังเพลงพิณและการเดินหมากกับสหายร่วมตระกูลในวันว่าง",
            "อายุ 6 ปี เข้าร่วมงานเลี้ยงสังสรรค์เครือญาติในจวนใหญ่ ได้รับของขวัญและเงินอั่งเปาจากผู้ใหญ่ในตระกูล",
            "อายุ 7 ปี เริ่มศึกษาคัมภีร์ปราชญ์อย่างจริงจัง ปัญญาและความคิดเริ่มโตเกินวัยจนเป็นที่เลื่องลือในหมู่บ่าวรับใช้",
            "อายุ 8 ปี ออกเดินทางไปทำบุญที่วัดบนยอดเขาร่วมกับมารดา ได้พบเห็นวิถีชีวิตราษฎรนอกจวนตระกูลใหญ่",
            "อายุ 9 ปี ฝึกฝนการวาดภาพทิวทัศน์และแต่งบทกลอนมงคล สื่อความหมายถึงความมุ่งมั่นในอนาคต",
            "อายุ 10 ปี เริ่มช่วยงานจุกจิกในเรือน บิดาเริ่มทดสอบความรู้ทางการเมืองและเหตุการณ์บ้านเมือง",
            "อายุ 11 ปี ฝึกฝนวิทยายุทธเบื้องต้นและการขี่ม้าพิทักษ์ตนเอง เพื่อเตรียมพร้อมรับมือวิกฤตอันตราย",
            "อายุ 12 ปี เริ่มศึกษากลยุทธ์ตำราพิชัยสงครามและการชิงไหวชิงพริบทางการเมืองในหนังสือลับบรรพชน",
            "อายุ 13 ปี เริ่มมีชื่อเสียงเล่าลือในหมู่คุณหนูและคุณชายเมืองหลวง ถึงสติปัญญาและกิริยาท่าทางอันงดงาม",
            "อายุ 14 ปี เข้าสู่ช่วงวัยรุ่นตอนปลาย ทุ่มเทฝึกฝนความรู้เพื่อเตรียมความพร้อมสู่การสอบประเมินเข้าวัง",
            "อายุ 15 ปี เติบโตเป็นผู้ใหญ่เต็มตัว เตรียมพร้อมทำพิธีปักปิ่น/สวมหมวก ก้าวเข้าสู่ยุทธภพและราชสำนัก!"
        ];

        function saveGame() {
            try { localStorage.setItem('dynasty_game_v45', JSON.stringify(game)); } catch(e) {}
        }

        function saveGameManually() {
            saveGame();
            showModal("บันทึกเกมสำเร็จ", "ข้อมูลเกมทั้งหมดถูกบันทึกเรียบร้อยแล้วจ้า!");
        }

        function initGameSession() {
            let sInput = document.getElementById('input-surname');
            let fInput = document.getElementById('input-firstname');
            let gInput = document.getElementById('input-gender');
            let pInput = document.getElementById('input-status-choice');

            if(sInput && sInput.value.trim()) game.surname = sInput.value.trim();
            if(fInput && fInput.value.trim()) game.firstname = fInput.value.trim();
            if(gInput) game.gender = gInput.value;
            game.pathType = pInput ? pInput.value : 'ขุนนาง';

            if(game.pathType === 'ทาส') {
                game.money = 30;
                game.career = "ทาสรับใช้ในจวนตระกูลใหญ่";
                game.careerRank = "ชนชั้นล่าง (เก็บเงิน 500 ไถ่ตัว)";
            } else if(game.pathType === 'แม่ทัพ') {
                game.money = 400;
                game.stats.combat = 30;
                game.career = "ทายาทค่ายทหารชายแดน";
                game.careerRank = "บุตรนายทหาร";
            } else if(game.pathType === 'ตกอับ') {
                game.isFramed = true;
                game.money = 50;
                game.career = "อดีตทายาทขุนนางถูกใส่ร้าย";
                game.careerRank = "สามัญชนติดมลทิน";
            } else if(game.pathType === 'วังหลัง') {
                game.money = 350;
                game.stats.charm = 30;
                game.career = "โฉมงามตระกูลสูง";
                game.careerRank = "คุณหนูผู้เลอโฉม";
            } else if(game.pathType === 'พ่อค้า') {
                game.money = 700;
                game.career = "ทายาทคหบดีใหญ่";
                game.careerRank = "ทายาทพ่อค้า";
            } else {
                game.money = 300;
                game.stats.intelligence = 25;
                game.career = "บุตรขุนนางสำนักหลวง";
                game.careerRank = "คุณชาย/คุณหนูตระกูลขุนนาง";
            }

            game.chronicleLog.push({
                year: 1,
                age: 0,
                title: "ถือกำเนิดลืมตาดูโลก",
                text: `ถือกำเนิดในเส้นทางชะตากรรม [${game.pathType}] ในตระกูล ${game.surname} บิดามารดาตั้งนามให้ว่า ${game.firstname} เริ่มต้นบันทึกมหากาพย์ชีวิต!`
            });

            let setupScreen = document.getElementById('setup-screen');
            if(setupScreen) setupScreen.style.display = 'none';
            saveGame();
            updateScreen();
        }

        function updateMiniBar() {
            document.getElementById('bar-money').innerText = game.money;
            document.getElementById('bar-intel').innerText = game.stats.intelligence;
            document.getElementById('bar-combat').innerText = game.stats.combat;
            document.getElementById('bar-charm').innerText = game.stats.charm;
            document.getElementById('bar-prestige').innerText = game.stats.prestige;
        }

        function updateScreen() {
            updateMiniBar();
            document.getElementById('header-name').innerText = `${game.surname} ${game.firstname}`;
            document.getElementById('header-age').innerText = `อายุ ${game.age} ปี`;
            document.getElementById('header-season').innerText = game.seasons[game.seasonIndex];
            document.getElementById('header-avatar').innerText = game.age >= 16 ? (game.gender === 'หญิง' ? '👩' : '🧑') : '👶';
            document.getElementById('header-dynasty').innerText = game.isEmperor ? "👑 ฮ่องเต้ผู้ครองแผ่นดิน" : game.career;

            let container = document.getElementById('main-content');
            if(!container) return;
            container.innerHTML = "";

            if (game.currentTab === 'life') {
                // หน้าเรื่องราวชีวิต: แสดงพงศาวดารแบบบรรยายยาว และปุ่มเควสต์ชะตากรรมหลัก

                } else if(game.careerSubTab === 'sub2') {

                        <p style="font-size: 12px; color: #666; margin-bottom: 8px;">⚖️ <b>หมวดหมู่ย่อยที่ 2: ไต่สวนคดี & ถวายฎีกาปฏิรูป</b></p>
                        <button class="btn-action" onclick="feedAction('memorial')">
                            <span>⚖️ ร่างฎีกาเสนอเรื่องปฏิรูปภาษีท้องถิ่น</span>
                            <span class="feature-note">👉 ใช้ปัญญา (ต้องการ >= 15) แลกรับชื่อเสียงบารมี +20</span>
                        </button>
                    `;
                } else if(game.careerSubTab === 'sub3') {
                    subContent = `
                        <p style="font-size: 12px; color: #666; margin-bottom: 8px;">⚔️ <b>หมวดหมู่ย่อยที่ 3: รับมือคู่ปรับทางการเมือง</b></p>
                        <button class="btn-action" onclick="feedAction('rival')">
                            <span>⚔️ ส่งองครักษ์เสื้อแพรไปกดดัน (${game.workplace.rivalName})</span>
                            <span class="feature-note">👉 ใช้เงิน 80 ตำลึง เพิ่มบารมีข่มขวัญคู่แข่ง +15</span>
                        </button>
                    `;
                } else if(game.careerSubTab === 'sub4') {
                    subContent = `
                        <p style="font-size: 12px; color: #666; margin-bottom: 8px;">📈 <b>หมวดหมู่ย่อยที่ 4: สอบประเมินเลื่อนขั้นยศ</b></p>
                        <button class="btn-action" onclick="feedAction('promotion')">
                            <span>📜 สอบประเมินเลื่อนยศขุนนาง (ต้องการ Exp 100)</span>
                            <span class="feature-note">👉 เลื่อนขั้นขุนนางจากปัจจุบันไปสู่ตำแหน่งที่สูงกว่า</span>
                        </button>

                }

                container.innerHTML = `
                    <div class="card">
                        <h3>🏛️ ราชสำนัก & สายอาชีพ</h3>
                        <div style="font-size: 13px; margin-bottom: 10px; line-height: 1.6; background:#faf8f2; padding:10px; border-radius:8px;">
                            <div><b>ตำแหน่งอาชีพ:</b> ${game.career}</div>
                            <div><b>บรรดาศักดิ์:</b> ${game.careerRank} (เลเวล ${game.careerLevel})</div>
                            <div><b>ความโปรดปรานเจ้านาย:</b> ${game.workplace.bossFavor}%</div>
                            <div><b>ค่าประสบการณ์งาน:</b> ${game.careerExp} / 100</div>
                        </div>
                        
                        <div class="sub-menu-tabs">
                            <div class="sub-tab ${game.careerSubTab==='sub1'?'active':''}" onclick="setCareerSub('sub1')">1. เข้าเฝ้า</div>

                            <div class="sub-tab ${game.careerSubTab==='sub3'?'active':''}" onclick="setCareerSub('sub3')">3. คู่ปรับ</div>
                            <div class="sub-tab ${game.careerSubTab==='sub4'?'active':''}" onclick="setCareerSub('sub4')">4. เลื่อนขั้น</div>

                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'family') {
                // หน้าจวนตระกูล & ทายาท: เน้นขยายเรือน แต่งงาน มีทายาท อบรมลูก
                container.innerHTML = `
                    <div class="card">
                        <h3>🏠 จวนตระกูล, เครือญาติ & ทายาท</h3>
                        <div style="font-size: 13px; margin-bottom: 12px; line-height: 1.7;">
                            <div><b>ระดับคฤหาสน์:</b> ระดับ ${game.family.mansionLevel} (บ่าว: ${game.family.servants} คน) <button onclick="upgradeMansion()" style="padding:2px 6px; font-size:11px; cursor:pointer;">ขยายจวน (300)</button></div>
                            <div><b>🛡️ ค่ายองครักษ์พิทักษ์จวน:</b> ระดับ ${game.family.guards} <button onclick="upgradeGuards()" style="padding:2px 6px; font-size:11px; cursor:pointer;">เกณฑ์ (200)</button></div>
                            <div><b>🌾 โรงนา & ธุรกิจตระกูล:</b> ระดับ ${game.family.granary} <button onclick="upgradeGranary()" style="padding:2px 6px; font-size:11px; cursor:pointer;">สร้าง (250)</button></div>
                            <div><b>⛩️ หอคัมภีร์บรรพชน:</b> ระดับ ${game.family.libraryLevel} <button onclick="upgradeLibrary()" style="padding:2px 6px; font-size:11px; cursor:pointer;">สร้าง (350)</button></div>
                            <div><b>🤝 สายสัมพันธ์ Connection:</b> ${game.family.connection}% <button onclick="buildConnection()" style="padding:2px 6px; font-size:11px; cursor:pointer;">สานสัมพันธ์ (100)</button></div>
                            <hr style="margin: 8px 0; border-color: #eee;">
                            <div><b>คู่ครอง:</b> ${game.family.spouse} (ความสัมพันธ์: ${game.family.spouseAffection}%)</div>
                            <div><b>อนุภรรยา/สามีรอง:</b> ${game.family.concubines.length > 0 ? game.family.concubines.join(', ') : 'ไม่มี'} <button onclick="addConcubine()" style="padding:2px 6px; font-size:11px; cursor:pointer;">รับอนุเพิ่ม</button></div>
                            <div><b>ทายาทสืบสกุล (${game.family.heirs.length} คน):</b> ${game.family.heirs.length > 0 ? game.family.heirs.map(h => h.name).join(', ') : 'ยังไม่มี'} <button onclick="educateHeirs()" style="padding:2px 6px; font-size:11px; cursor:pointer;">อบรมทายาท</button></div>
                        </div>
                        <div class="action-grid">
                            <button class="btn-action" onclick="arrangeMarriage()">
                                <span>💍 สู่ขอแต่งงาน / รับคู่ครองเข้าจวน</span>
                                <span class="feature-note">👉 สร้างครอบครัวแต่งงานตามประเพณี (อายุ 16 ปีขึ้นไป)</span>
                            </button>
                            <button class="btn-action" onclick="haveChild()">
                                <span>🐣 ให้กำเนิดทายาทสืบสกุล</span>
                                <span class="feature-note">👉 ให้กำเนิดทายาทรุ่น 2 เพื่อสืบทอดตระกูล</span>
                            </button>
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'training') {
                // หน้าฝึกฝนทักษะ: เน้นฝึกสเตตัสหลัก และฝึกศิลปะ 4 แขนง 琴棋書画
                container.innerHTML = `
                    <div class="card">
                        <h3>🏮 สำนักศึกษา & ฝึกฝน 4 ศิลปะ (琴棋書画)</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="doTrainStats('intel')">
                                <span>📖 [สำนักศึกษาหลวง] ศึกษาตำราปราชญ์ (+ปัญญา)</span>
                                <span class="feature-note">👉 พัฒนาความคิดและสติปัญญาเชิงลึก</span>
                            </button>
                            <button class="btn-action" onclick="doTrainStats('combat')">
                                <span>⚔️ [ค่ายทหารหลวง] ฝึกยุทธ์พิชัยสงคราม (+พลังยุทธ์)</span>
                                <span class="feature-note">👉 พัฒนาร่างกายและทักษะต่อสู้</span>
                            </button>
                            <button class="btn-action" onclick="doTrainStats('charm')">

                            </button>

                                <span>棋 [หอคัมภีร์] ฝึกเดินหมากกระดาน (ทักษะหมาก: ${game.skills.chess})</span>
                                <span class="feature-note">👉 เพิ่มปัญญาเชิงกลยุทธ์</span>
                            </button>
                            <button class="btn-action" onclick="doSkillTraining('calligraphy')">
                                <span>書 [สำนักอักษร] ฝึกคัดลายมือพู่กัน (ทักษะอักษร: ${game.skills.calligraphy})</span>
                                <span class="feature-note">👉 เพิ่มชื่อเสียงและปัญญา</span>
                            </button>
                            <button class="btn-action" onclick="doSkillTraining('painting')">
                                <span>画 [หอศิลป์] ฝึกวาดภาพทิวทัศน์ (ทักษะวาดภาพ: ${game.skills.painting})</span>

        function setCareerSub(sub) {
            game.careerSubTab = sub;
            updateScreen();
        }

        function feedAction(actionType) {
            if(actionType === 'audience') {
                game.careerExp += 25;
                game.money += 80;
                game.workplace.bossFavor = Math.min(100, game.workplace.bossFavor + 10);
                game.chronicleLog.push({
                    year: game.year,
                    age: game.age,
                    title: "เข้าเฝ้าถวายรายงาน",
                    text: `เข้าเฝ้าใต้เท้าเพื่อรายงานผลงานหลวงอย่างเป็นระเบียบ ได้รับคำชมเชย เบี้ยหวัด 80 ตำลึง และเพิ่มความโปรดปรานเป็น ${game.workplace.bossFavor}%`
                });
                showModal("เข้าเฝ้าสำเร็จ", "ถวายงานเรียบร้อย! ได้รับค่าประสบการณ์งาน +25 และเงิน 80 ตำลึง");
            } else if(actionType === 'memorial') {
                if(game.stats.intelligence >= 15) {
                    game.stats.prestige += 20;
                    game.chronicleLog.push({
                        year: game.year,
                        age: game.age,
                        title: "ถวายฎีกาปฏิรูปภาษี",
                        text: "ร่างฎีกาสำคัญเสนอเรื่องปฏิรูปภาษีราษฎร ฮ่องเต้ทรงเห็นชอบและพระราชทานรางวัล ชื่อเสียงบารมีเพิ่มขึ้น +20"
                    });
                    showModal("ถวายฎีกาสำเร็จ", "ฎีกาของท่านโดนใจฮ่องเต้ ชื่อเสียงพุ่งกระฉูด +20!");
                } else {
                    showModal("ล้มเหลว", "สติปัญญาของท่านยังไม่พอที่จะร่างฎีกาสำคัญ (ต้องการปัญญา >= 15)");
                }
            } else if(actionType === 'rival') {
                if(game.money >= 80) {
                    game.money -= 80;
                    game.stats.prestige += 15;
                    game.chronicleLog.push({
                        year: game.year,
                        age: game.age,
                        title: "กดดันคู่ปรับทางการเมือง",
                        text: `ส่งหน่วยองครักษ์เสื้อแพรไปสืบข่าวและกดดันคู่แข่ง (${game.workplace.rivalName}) สำเร็จ ทำให้บารมีทางการเมืองเพิ่มขึ้น +15`
                    });
                    showModal("สำเร็จ!", `ส่งหน่วยองครักษ์จัดการคู่ปรับ (${game.workplace.rivalName}) สำเร็จ ชื่อเสียงเพิ่มขึ้น +15!`);
                } else {
                    showModal("เงินไม่พอ", "ต้องใช้เงิน 80 ตำลึง");
                }
            } else if(actionType === 'promotion') {
                if(game.careerExp >= 100) {
                    game.careerExp = 0;
                    game.careerLevel += 1;
                    game.careerRank = `ขุนนางขั้น ${10 - game.careerLevel}`;
                    game.chronicleLog.push({
                        year: game.year,
                        age: game.age,
                        title: "สอบเลื่อนขั้นขุนนางสำเร็จ",
                        text: `ผ่านการสอบประเมินผลงานหลวง เลื่อนตำแหน่งขุนนางขึ้นเป็น [${game.careerRank}] ได้รับความเคารพนับถือในสภาราชสำนัก`
                    });
                    showModal("เลื่อนขั้นยศสำเร็จ! 📜", `เลื่อนตำแหน่งขึ้นเป็น <b>${game.careerRank}</b> เรียบร้อย!`);
                } else {
                    showModal("Exp ไม่พอ", `ค่าประสบการณ์งานยังไม่ครบ 100 (ปัจจุบัน ${game.careerExp}/100)`);
                }
            }
            saveGame();
            updateScreen();
        }

        function advanceYear() {
            game.age += 1;
            game.year += 1;
            game.seasonIndex = (game.seasonIndex + 1) % 4;

            let yearStoryTitle = "";
            let yearStoryText = "";

            if(game.age < 16) {
                yearStoryTitle = `ชีวิตวัยเด็ก (อายุ ${game.age} ปี)`;
                yearStoryText = childhoodStories[game.age] || `เติบโตขึ้นตามวัยในจวนตระกูล ศึกษาเล่าเรียนวิชาต่างๆ เพื่อเตรียมตัวเข้าสู่โลกภายนอก`;
            } else if(game.age === 16) {
                game.career = "ขุนนางฝึกหัดราชสำนัก";
                game.careerRank = "ขุนนางขั้น 9";
                yearStoryTitle = "冠 พิธีปักปิ่น & สวมหมวก";
                yearStoryText = "ทำพิธีปักปิ่น/สวมหมวกเข้าสู่วัยผู้ใหญ่เต็มตัว เข้ารับการบรรจุเป็นขุนนางฝึกหัดในราชสำนัก เริ่มต้นเส้นทางไต่เต้าอำนาจ!";
            } else {
                let salary = 150 + (game.careerLevel * 50) + (game.family.granary * 80);
                game.money += salary;
                yearStoryTitle = `รับตำแหน่งปฏิบัติหน้าที่ (อายุ ${game.age} ปี)`;
                yearStoryText = `ปฏิบัติหน้าที่ในตำแหน่ง [${game.career}] อย่างแข็งขัน ได้รับเบี้ยหวัดหลวงและกำไรจากธุรกิจตระกูลรวม ${salary} ตำลึง บารมีตระกูลมั่นคงยิ่งขึ้น`;
            }

            game.chronicleLog.push({
                year: game.year,
                age: game.age,
                title: yearStoryTitle,
                text: yearStoryText
            });

            saveGame();
            updateScreen();
            triggerRandomEvent();
        }

        function triggerRandomEvent() {
            if(Math.random() < 0.45) {
                let events = [
                    { 
                        title: "📜 เหตุการณ์วิกฤต: ขุนนางกังฉินทุจริต", 
                        desc: "ท่านพบเบาะแสลับการยักยอกเงินคลังหลวงของขุนนางท้องถิ่น จะเลือกสืบสวนเปิดโปงเพื่อบารมี หรือเก็บเงียบเอาตัวรอด?", 
                        prestige: 20, 
                        money: 100 
                    },
                    { 
                        title: "🌸 เทศกาลชมดอกไม้ประจำปี", 
                        desc: "ท่านเข้าร่วมงานเลี้ยงชมดอกไม้ประจำปีในวังหลวง ได้ประชันบทกลอนและดีดพิณจนเป็นที่ประทับใจของบรรดาชนชั้นสูง", 
                        charm: 15, 
                        money: 50 
                    },
                    { 
                        title: "⚔️ วิกฤตโจรป่าชายแดน", 
                        desc: "เกิดเหตุโจรป่าชุกชุมชานเมืองหลวง ท่านนำกำลังองครักษ์ออกปราบปรามรักษาความสงบเรียบร้อย", 
                        combat: 15, 
                        prestige: 10 
                    }
                ];
                let ev = events[Math.floor(Math.random() * events.length)];
                if(ev.prestige) game.stats.prestige += ev.prestige;
                if(ev.charm) game.stats.charm += ev.charm;
                if(ev.combat) game.stats.combat += ev.combat;
                if(ev.money) game.money += ev.money;
                
                game.chronicleLog.push({
                    year: game.year,
                    age: game.age,
                    title: ev.title,
                    text: `${ev.desc} (ได้รับผลลัพธ์การตัดสินใจเรียบร้อย)`
                });

                setTimeout(() => {
                    showModal(ev.title, ev.desc + "<br><br><b>[ผลลัพธ์]:</b> เหตุการณ์ถูกบันทึกลงในพงศาวดารชีวิตเรียบร้อย!");
                }, 300);
            }
        }

        function doTrainStats(type) {
            let gain = Math.floor(Math.random() * 8) + 5;
            if(type === 'intel') game.stats.intelligence += gain;
            else if(type === 'combat') game.stats.combat += gain;
            else game.stats.charm += gain;

            saveGame();
            updateScreen();
            showModal("ฝึกฝนสำเร็จ", `ทุ่มเทฝึกฝนพัฒนาตนเองสำเร็จ ได้รับแต้มเพิ่มขึ้น +${gain}!`);
        }

        function doSkillTraining(skillKey) {
            let gain = Math.floor(Math.random() * 6) + 4;
            game.skills[skillKey] += gain;
            if(skillKey === 'guqin' || skillKey === 'painting') game.stats.charm += 5;
            else game.stats.intelligence += 5;

            let names = { guqin: "ดีดพิณ", chess: "เดินหมาก", calligraphy: "คัดลายมือ", painting: "วาดภาพ" };
            saveGame();
            updateScreen();
            showModal(`琴棋書画: ฝึก${names[skillKey]}`, `ทักษะ${names[skillKey]}เพิ่มขึ้น +${gain}!`);
        }

        function upgradeMansion() {
            if(game.money >= 300) {
                game.money -= 300;
                game.family.mansionLevel += 1;
                game.family.servants += 3;
                showModal("ขยายจวนสำเร็จ", `คฤหาสน์ยกระดับเป็นระดับ ${game.family.mansionLevel}! มีบ่าวรับใช้เพิ่มเป็น ${game.family.servants} คน`);
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการเงิน 300 ตำลึง"); }
        }

        function upgradeGuards() {
            if(game.money >= 200) {
                game.money -= 200;
                game.family.guards += 1;
                game.stats.combat += 10;
                showModal("เกณฑ์องครักษ์สำเร็จ", "จัดตั้งกองกำลังองครักษ์พิทักษ์จวนสำเร็จ พลังยุทธ์เพิ่มขึ้น +10");
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการเงิน 200 ตำลึง"); }
        }

        function upgradeGranary() {
            if(game.money >= 250) {
                game.money -= 250;
                game.family.granary += 1;
                showModal("สร้างโรงนาสำเร็จ", "ขยายโรงนาและกิจการการค้าตระกูล เพิ่มกำไรประจำปี");
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการเงิน 250 ตำลึง"); }
        }

        function upgradeLibrary() {
            if(game.money >= 350) {
                game.money -= 350;
                game.family.libraryLevel += 1;
                showModal("สร้างหอคัมภีร์สำเร็จ", "สร้างหอคัมภีร์บรรพชน ช่วยเพิ่มโบนัสการเรียนรู้ทักษะปัญญา");
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการเงิน 350 ตำลึง"); }
        }

        function buildConnection() {
            if(game.money >= 100) {
                game.money -= 100;
                game.family.connection = Math.min(100, game.family.connection + 15);
                showModal("สานสัมพันธ์", `จัดงานเลี้ยงผูกมิตรขุนนาง สายสัมพันธ์ Connection เพิ่มขึ้นเป็น ${game.family.connection}%!`);
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการ 100 ตำลึง"); }
        }

        function arrangeMarriage() {
            if(game.age < 16) { showModal("ยังไม่ถึงเกณฑ์", "ต้องมีอายุ 16 ปีขึ้นไป"); return; }
            game.family.spouse = "ฮูหยิน/สามีตระกูลสูงศักดิ์";
            game.family.spouseAffection = 70;
            showModal("มงคลสมรส", "จัดพิธีแต่งงานสู่ขอคู่ครองตามประเพณีตระกูลใหญ่เรียบร้อย!");
            saveGame();
            updateScreen();
        }

        function haveChild() {
            if(game.age < 16 || game.family.spouse === "โสด") { showModal("เงื่อนไขไม่ครบ", "ต้องมีอายุ 16 ปีขึ้นไปและแต่งงานมีคู่ครองแล้ว"); return; }
            let name = prompt("ตั้งชื่อทายาทสืบสกุล:", "เป่าเปา");
            if(name) {
                game.family.heirs.push({ name: name });
                showModal("ทายาทถือกำเนิด", `ทายาทสืบสกุลนามว่า "${name}" ถือกำเนิดในคฤหาสน์จวนตระกูล`);
            }
            saveGame();
            updateScreen();
        }

        function educateHeirs() {
            if(game.money >= 100) {
                game.money -= 100;
                game.stats.prestige += 10;
                showModal("อบรมทายาท", "ว่าจ้างอาจารย์พิเศษมาอบรมทายาทสืบสกุล ชื่อเสียงตระกูลเพิ่มขึ้น +10!");
                saveGame();
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการ 100 ตำลึง"); }
        }

        function addConcubine() {
            if(game.age < 16) { showModal("ยังไม่ถึงเกณฑ์", "ต้องมีอายุ 16 ปีขึ้นไป"); return; }
            let name = prompt("ชื่ออนุภรรยา/สามีรอง:", "ซูซู");
            if(name) {
                game.family.concubines.push(name);
                showModal("รับเข้าจวน", `รับ "${name}" เข้ามาเป็นอนุภรรยาในเรือนเรียบร้อย`);
                saveGame();
                updateScreen();
            }
        }

        function openMarketModal() {
            toggleDrawer(false);
            let profit = Math.floor(Math.random() * 120) + 60;
            game.money += profit;
            showModal("🛒 ตลาดมืด & ลงทุนค้าขาย", `ท่านเดินทางไปยังตลาดมืดเมืองหลวง นำเงินไปลงทุนเก็งกำไรสินค้าอัญมณีโบราณ ได้รับกำไรสุทธิ ${profit} ตำลึง!`);
            updateScreen();
        }

        function openHospitalModal() {
            toggleDrawer(false);
            if(game.money >= 50) {
                game.money -= 50;
                game.health = 100;
                showModal("💊 โรงหมอหลวง", "ซื้อโสมร้อยปีและสมุนไพรบำรุงธาตุ รักษาสุขภาพกลับมาเต็ม 100%!");
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการ 50 ตำลึง"); }
        }

        function openFortuneModal() {
            toggleDrawer(false);
            if(game.money >= 50) {
                game.money -= 50;
                game.stats.prestige += 15;
                showModal("🔮 สำนักหมอดูฮวงจุ้ย", "หมอดูตาบอดทักทำนายดวงชะตาว่า: <i>'ปีนี้ราศีจับ บารมีพุ่งกระฉูด!'</i> ชื่อเสียงเพิ่มขึ้น +15!");
                updateScreen();
            } else { showModal("เงินไม่พอ", "ค่าครูหมอดู 50 ตำลึง"); }
        }

        function openChronicleFullModal() {
            toggleDrawer(false);
            let logsHtml = game.chronicleLog.slice().reverse().map(item => `
                <div style="border-bottom:1px dashed #ccc; padding:6px 0;">
                    <b>[ปีที่ ${item.year}] อายุ ${item.age} ปี: ${item.title || ''}</b><br>
                    ${item.text}
                </div>
            `).join('');
            showModal("📜 สมุดจดพงศาวดารฉบับเต็ม", `<div style="max-height:300px; overflow-y:auto; font-size:12px; text-align:left;">${logsHtml}</div>`);
        }

        function openVengeanceOrThroneModal() {
            let content = "";
            if(game.pathType === 'ทาส') {
                content = `<b>สถานะ: ทาสรับใช้</b><br>สะสมเงินทองให้ครบ 500 ตำลึงเพื่อไถ่ตัวอิสระ!<br><br><button class="btn-action" onclick="redeemSlave()">🪙 ไถ่ตัวเป็นสามัญชน (ใช้ 500 ตำลึง)</button>`;
            } else if(game.isFramed) {
                content = `<b>สถานะ: ขุนนางถูกใส่ร้าย</b><br>ใช้สติปัญญา 40 เพื่อสืบคดีล้างมลทินกู้ชื่อเสียงตระกูล!<br><br><button class="btn-action" onclick="investigateCase()">🔍 สืบคดีล้างมลทิน</button>`;
            } else {
                content = `<b>เส้นทางสู่บัลลังก์มังกร:</b><br>หากมีพลังต่อสู้ 80 และชื่อเสียง 100 สามารถนำกำลังก่อกบฏขึ้นเป็นฮ่องเต้ได้!<br><br><button class="btn-action" onclick="launchRebellion()">⚔️ ก่อกบฏยึดบัลลังก์มังกร</button>`;
            }
            showModal("⚔️ เควสต์ชะตากรรมหลัก", content);
        }

        function redeemSlave() {
            if(game.money >= 500) {
                game.money -= 500;
                game.pathType = 'ขุนนาง';
                game.career = "สามัญชนอิสระ";
                game.careerRank = "สามัญชน";
                closeModal();
                showModal("ไถ่ตัวสำเร็จ!", "ท่านไถ่ตัวเป็นอิสระเรียบร้อย เริ่มต้นชีวิตใหม่!");
                updateScreen();
            } else { showModal("เงินไม่พอ", "ต้องการ 500 ตำลึง"); }
        }

        function investigateCase() {
            if(game.stats.intelligence >= 40) {
                game.isFramed = false;
                game.career = "ขุนนางผู้ได้รับการล้างมลทิน";
                game.careerRank = "ขุนนาง";
                game.money += 1000;
                closeModal();
                showModal("ล้างมลทินสำเร็จ!", "ฮ่องเต้คืนบรรดาศักดิ์และทรัพย์สินมหาศาลให้ตระกูล!");
                updateScreen();
            } else { showModal("ปัญญาไม่พอ", "ต้องการสติปัญญา >= 40"); }
        }

        function launchRebellion() {
            if(game.stats.combat >= 80 && game.stats.prestige >= 100) {
                game.isEmperor = true;
                game.career = "องค์ฮ่องเต้ผู้ครองแผ่นดิน";
                game.careerRank = "ปฐมกษัตริย์";
                closeModal();
                showModal("👑 ชัยชนะแห่งบัลลังก์มังกร!", "ท่านนำกำลังสถาปนาตนเองเป็นฮ่องเต้ผู้ครองแผ่นดินต้าเซี่ย!");
                updateScreen();
            } else { showModal("กำลังพลไม่พร้อม", "ต้องมีพลังต่อสู้ >= 80 และชื่อเสียง >= 100"); }
        }

        function resetGame() {
            if(confirm("ท่านต้องการเริ่มเกมใหม่ทั้งหมดจริงหรือ? ข้อมูลเดิมจะหายไป")) { 
                localStorage.removeItem('dynasty_game_v45'); 
                location.reload(); 
            }
        }

        function toggleDrawer(open) {
            document.getElementById('left-drawer').classList.toggle('active', open);
            document.getElementById('drawer-overlay').classList.toggle('active', open);
        }

        function switchTab(tab) {
            game.currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            updateScreen();
        }

        function showModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('game-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('game-modal').classList.remove('active');
        }

        window.onload = function() {
            let saved = localStorage.getItem('dynasty_game_v45');
            if(saved) {
                game = JSON.parse(saved);
                document.getElementById('setup-screen').style.display = 'none';
                updateScreen();
            }
        };
    </script>

    .ui-btn-secondary { flex: 1; background: #f4f1ea; border: 1px solid var(--border-color); color: var(--text-dark); padding: 11px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .ui-btn-primary { flex: 2; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--gold-light); border: none; padding: 11px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(123,17,19,0.25); }

    .ui-summary-card { background: #fdfbf7; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: left; margin-bottom: 10px; font-size: 12px; line-height: 1.6; color: #333; }
    .ui-summary-heading { font-weight: bold; color: var(--primary); border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; margin-bottom: 6px; font-size: 13px; }
    .ui-family-pill { display: flex; justify-content: space-between; background: #fff; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; border: 1px solid #eee; font-size: 11px; }

    .ui-modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(2px); }
    .ui-modal-pane { background: #fff; width: 100%; max-width: 340px; border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; border-top: 5px solid var(--primary); max-height: 80vh; overflow-y: auto; }
    .ui-option-row { background: #faf8f2; border: 1px solid var(--border-color); width: 100%; padding: 10px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; text-align: left; margin-bottom: 6px; cursor: pointer; color: #333; }
    .ui-option-row:hover { background: var(--gold-light); color: var(--primary); border-color: var(--gold); }
</style>

<script>
    const p14Surnames = ["มู่หรง", "ไป๋", "เซียว", "ลู่", "เย่", "ซู", "เฟิง", "หลี่", "จ้าว", "ฮวา", "ตงฟาง", "หนานกง"];
    const p14FirstNames = ["เฟิ่ง", "ชิง", "หลาน", "เหมย", "เทียน", "อวี้", "หลง", "เซียน", "หนิง", "จิน", "อิง"];
    const p14Genders = ["ชาย", "หญิง"];
    const p14Dynasties = [
        { name: "ราชวงศ์ต้าเซี่ย (Great Xia)", money: 300 },
        { name: "ราชวงศ์ต้าถัง (Great Tang)", money: 350 },
        { name: "ยุคสามก๊ก (Three Kingdoms)", money: 400 },
        { name: "ราชวงศ์ต้าชิง (Great Qing)", money: 300 }
    ];
    
    const p14Origins = [
        { title: "👑 บุตรขุนนางตระกูลใหญ่ (สายบุ๋น)", path: "ขุนนาง", desc: "เกิดในตระกูลขุนนางทรงอิทธิพล มีเส้นสายในราชสำนัก เริ่มต้นด้วยปัญญาและเงินทุน" },
        { title: "⚔️ ทายาทค่ายทหารชายแดน (สายบู๊ขุนศึก)", path: "แม่ทัพ", desc: "เติบโตท่ามกลางกลิ่นอายสงครามและคมดาบ พลังยุทธ์สูง พร้อมออกศึกชิงชัย" },
        { title: "🌸 โฉมงามตระกูลสูง (สายชิงอำนาจวังหลัง)", path: "วังหลัง", desc: "รูปโฉมงดงาม เพียบพร้อมด้วยเสน่ห์และเล่ห์กลวังหลัง เตรียมเข้าสู่การคัดเลือกสนม" },
        { title: "⛓️ ทาสรับใช้ในจวน (สายไถ่ตัวจากจุดต่ำสุด)", path: "ทาส", desc: "ชีวิตรันทดถูกกดขี่ข่มเหง ต้องอดทนทำงานเก็บเงินเพื่อไถ่ตัวพลิกชีวิต" },
        { title: "⚠️ ทายาทขุนนางถูกใส่ร้าย (สายล้างมลทิน)", path: "ตกอับ", desc: "วงศ์ตระกูลล่มสลายจากข้อกล่าวหาเท็จ ต้องใช้สติปัญญาสืบหาความจริงกู้ชื่อเสียง" },
        { title: "💰 ทายาทคหบดีใหญ่ (สายการค้าพาณิชย์)", path: "พ่อค้า", desc: "ร่ำรวยเงินทองตั้งแต่วันเกิด มีกิจการค้าขายหนุนหลัง เงินทองไหลมาเทมา" }
    ];

    const p14Zodiacs = ["ปีมังกรทอง", "ปีพยัคฆ์คำราม", "ปีงูขาว", "ปีม้าศึก", "ปีหงส์เพลิง", "ปีกิเลนสวรรค์"];
    const p14Seasons = ["🌸 ฤดูใบไม้ผลิ", "☀️ ฤดูร้อน", "🍂 ฤดูใบไม้ร่วง", "❄️ ฤดูหนาว"];
    const p14BirthOrders = ["ลูกคนเดียวในจวน", "บุตรคนโต (พี่ใหญ่)", "บุตรคนรอง", "บุตรคนเล็ก (น้องนุชสุดท้อง)"];

    let p14Char = {
        surname: "มู่หรง",
        firstname: "เฟิ่ง",
        gender: "หญิง",
        dynasty: "ราชวงศ์ต้าเซี่ย (Great Xia)",
        originObj: p14Origins[0],
        zodiac: "ปีมังกรทอง",
        season: "🌸 ฤดูใบไม้ผลิ",
        birthOrder: "บุตรคนโต (พี่ใหญ่)",
        money: 300,
        stats: { intelligence: 15, combat: 10, charm: 20 },
        familyMembers: [
            { role: "บิดา", name: "มู่หรงเทียน", age: 42, career: "ขุนนางราชสำนัก" },
            { role: "มารดา", name: "ไป๋ฮูหยิน", age: 38, career: "นายหญิงตระกูลใหญ่" }
        ]
    };

    function p14RandomizeAll() {
        p14Char.surname = p14Surnames[Math.floor(Math.random() * p14Surnames.length)];
        p14Char.firstname = p14FirstNames[Math.floor(Math.random() * p14FirstNames.length)];
        p14Char.gender = p14Genders[Math.floor(Math.random() * p14Genders.length)];
        
        let dyn = p14Dynasties[Math.floor(Math.random() * p14Dynasties.length)];
        p14Char.dynasty = dyn.name;
        p14Char.money = dyn.money;

        p14Char.originObj = p14Origins[Math.floor(Math.random() * p14Origins.length)];
        p14Char.zodiac = p14Zodiacs[Math.floor(Math.random() * p14Zodiacs.length)];
        p14Char.season = p14Seasons[Math.floor(Math.random() * p14Seasons.length)];
        p14Char.birthOrder = p14BirthOrders[Math.floor(Math.random() * p14BirthOrders.length)];

        p14Char.stats.intelligence = Math.floor(Math.random() * 25) + 10;
        p14Char.stats.combat = Math.floor(Math.random() * 25) + 5;
        p14Char.stats.charm = Math.floor(Math.random() * 25) + 10;

        let dadName = p14Char.surname + " " + p14FirstNames[Math.floor(Math.random() * p14FirstNames.length)];
        let famList = [
            { role: "บิดา", name: dadName, age: 42, career: p14Char.originObj.path === 'แม่ทัพ' ? 'แม่ทัพค่ายหลวง' : 'ขุนนางผู้ใหญ่' },
            { role: "มารดา", name: "ฮูหยินตระกูล " + p14Char.surname, age: 38, career: 'นายหญิงตระกูลขุนนาง' }
        ];

        if (p14Char.birthOrder !== "ลูกคนเดียวในจวน") {
            let sibName = p14Char.surname + " " + p14FirstNames[Math.floor(Math.random() * p14FirstNames.length)];
            let sibRole = p14Char.birthOrder.includes("คนโต") ? "น้องรอง" : "พี่ใหญ่";
            famList.push({ role: sibRole, name: sibName, age: 12, career: "ทายาทในจวน" });
        }

        p14Char.familyMembers = famList;
        renderP14SetupScreen();
    }

    function renderP14SetupScreen() {
        let setupCard = document.querySelector('.setup-card');
        if(!setupCard) return;

        setupCard.innerHTML = `
            <div class="ui-setup-box">
                <div class="ui-title">🌱 กำเนิดชีวิตใหม่</div>
                <div class="ui-subtitle">คลิกการ์ดเพื่อปรับแต่งข้อมูล หรือกดสุ่มใหม่ได้ทันที</div>
                
                <div class="ui-card-item" onclick="p14OpenNameModal()">
                    <div>
                        <div class="ui-card-label">ชื่อ - นามสกุล</div>
                        <div class="ui-card-value" id="disp-p14-name">${p14Char.surname} ${p14Char.firstname}</div>
                    </div>
                    <div class="ui-card-badge">แก้ไข</div>
                </div>

                <div class="ui-card-item" onclick="p14OpenGenderModal()">
                    <div>
                        <div class="ui-card-label">เพศตัวละคร</div>
                        <div class="ui-card-value">${p14Char.gender}</div>
                    </div>
                    <div class="ui-card-badge">แก้ไข</div>
                </div>

                <div class="ui-card-item" onclick="p14OpenDynastyModal()">
                    <div>
                        <div class="ui-card-label">ยุคราชวงศ์กำเนิด</div>
                        <div class="ui-card-value">${p14Char.dynasty}</div>
                    </div>
                    <div class="ui-card-badge">แก้ไข</div>
                </div>

                <div class="ui-card-item" onclick="p14OpenOriginModal()">
                    <div>
                        <div class="ui-card-label">จุดเริ่มต้นชะตากรรม</div>
                        <div class="ui-card-value" style="font-size:11px;">${p14Char.originObj.title}</div>
                    </div>
                    <div class="ui-card-badge">แก้ไข</div>
                </div>

                <div class="ui-card-item" onclick="p14OpenFamilyModal()">
                    <div>
                        <div class="ui-card-label">สถานะครอบครัว</div>
                        <div class="ui-card-value" style="font-size:11px;">${p14Char.birthOrder}</div>
                    </div>
                    <div class="ui-card-badge">แก้ไข</div>
                </div>

                <div class="ui-bottom-flex">
                    <button class="ui-btn-secondary" onclick="p14RandomizeAll()">🎲 สุ่มใหม่</button>
                    <button class="ui-btn-primary" onclick="p14ShowSummary()">📜 สรุปดวงชะตาก่อนเกิด</button>
                </div>
            </div>
        `;
    }

    function p14ShowSummary() {
        let setupCard = document.querySelector('.setup-card');
        if(!setupCard) return;

        let familyHtml = p14Char.familyMembers.map(m => `
            <div class="ui-family-pill">
                <span><b>${m.name}</b> (${m.role})</span>
                <span>อายุ ${m.age} ปี | ${m.career}</span>
            </div>
        `).join('');

        setupCard.innerHTML = `
            <div class="ui-setup-box">
                <div class="ui-title">📜 สรุปดวงชะตาแรกเกิด</div>
                <div class="ui-subtitle">${p14Char.surname} ${p14Char.firstname} (${p14Char.gender})</div>

                <div class="ui-summary-card">
                    <div class="ui-summary-heading">📍 จุดเริ่มต้นชีวิต</div>
                    <p style="margin-bottom: 4px;">กำเนิดใน <b>${p14Char.dynasty}</b> (${p14Char.originObj.title})</p>
                    <p style="color:#555; font-size:11px;">${p14Char.originObj.desc}</p>
                    <p style="margin-top:4px;"><b>สถานะ:</b> ${p14Char.birthOrder} | <b>ราศี:</b> ${p14Char.zodiac} (${p14Char.season})</p>
                </div>

                <div class="ui-summary-card">
                    <div class="ui-summary-heading">👨‍👩‍👧 ครอบครัวในจวน</div>
                    ${familyHtml}
                </div>

                <div class="ui-summary-card">
                    <div class="ui-summary-heading">⚡ ค่าพลังแรกเกิด</div>
                    <div>📖 ปัญญา: <b>${p14Char.stats.intelligence}</b> | ⚔️ ยุทธ์: <b>${p14Char.stats.combat}</b> | 🌸 เสน่ห์: <b>${p14Char.stats.charm}</b></div>
                </div>

                <div class="ui-bottom-flex">
                    <button class="ui-btn-secondary" onclick="renderP14SetupScreen()">⬅️ ย้อนกลับ</button>
                    <button class="ui-btn-primary" onclick="p14StartGame()">🚀 เริ่มใช้ชีวิต 0 -> 1</button>
                </div>
            </div>
        `;
    }

    // Modal แก้ไขชื่อ-นามสกุล (สร้างใหม่แยกขาดจากตัวเดิม ป้องกันการชน)
    function p14OpenNameModal() {
        let oldBg = document.getElementById('p14-modal-name');
        if(oldBg) oldBg.remove();

        let overlay = document.createElement('div');
        overlay.id = 'p14-modal-name';
        overlay.className = 'ui-modal-bg';
        overlay.innerHTML = `
            <div class="ui-modal-pane">
                <h3 style="color:var(--primary); margin-bottom:10px; font-size:15px;">✍️ แก้ไขชื่อ - นามสกุล</h3>
                <div style="margin-bottom:8px; text-align:left;">
                    <label style="font-size:11px; font-weight:bold;">นามสกุลตระกูล:</label>
                    <input type="text" id="input-p14-sur" class="form-control" value="${p14Char.surname}" style="padding:8px; font-size:13px;">
                </div>
                <div style="margin-bottom:14px; text-align:left;">
                    <label style="font-size:11px; font-weight:bold;">ชื่อจริง:</label>
                    <input type="text" id="input-p14-first" class="form-control" value="${p14Char.firstname}" style="padding:8px; font-size:13px;">
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="ui-btn-secondary" onclick="document.getElementById('p14-modal-name').remove()">ยกเลิก</button>
                    <button class="ui-btn-primary" onclick="p14SaveName()">บันทึก</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function p14SaveName() {
        let s = document.getElementById('input-p14-sur').value.trim();
        let f = document.getElementById('input-p14-first').value.trim();
        if(s) p14Char.surname = s;
        if(f) p14Char.firstname = f;
        let modal = document.getElementById('p14-modal-name');
        if(modal) modal.remove();
        renderP14SetupScreen();
    }

    function p14OpenGenderModal() {
        let overlay = document.createElement('div');
        overlay.className = 'ui-modal-bg';
        overlay.innerHTML = `
            <div class="ui-modal-pane">
                <h3 style="color:var(--primary); margin-bottom:12px; font-size:15px;">🚻 เลือกเพศตัวละคร</h3>
                <button class="ui-option-row" onclick="p14SaveGender('ชาย', this)">👨 ชาย</button>
                <button class="ui-option-row" onclick="p14SaveGender('หญิง', this)">👩 หญิง</button>
                <button class="ui-btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.ui-modal-bg').remove()">ยกเลิก</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function p14SaveGender(g, btn) {
        p14Char.gender = g;
        btn.closest('.ui-modal-bg').remove();
        renderP14SetupScreen();
    }

    function p14OpenDynastyModal() {
        let overlay = document.createElement('div');
        overlay.className = 'ui-modal-bg';
        let optionsHtml = p14Dynasties.map(d => `<button class="ui-option-row" onclick="p14SaveDynasty('${d.name}', ${d.money}, this)">🏛️ ${d.name}</button>`).join('');
        overlay.innerHTML = `
            <div class="ui-modal-pane">
                <h3 style="color:var(--primary); margin-bottom:12px; font-size:15px;">🏛️ เลือกยุคราชวงศ์กำเนิด</h3>
                ${optionsHtml}
                <button class="ui-btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.ui-modal-bg').remove()">ยกเลิก</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function p14SaveDynasty(name, money, btn) {
        p14Char.dynasty = name;
        p14Char.money = money;
        btn.closest('.ui-modal-bg').remove();
        renderP14SetupScreen();
    }

    function p14OpenOriginModal() {
        let overlay = document.createElement('div');
        overlay.className = 'ui-modal-bg';
        let optionsHtml = p14Origins.map((o, idx) => `
            <button class="ui-option-row" onclick="p14SaveOrigin(${idx}, this)">
                <b>${o.title}</b>
            </button>
        `).join('');
        overlay.innerHTML = `
            <div class="ui-modal-pane">
                <h3 style="color:var(--primary); margin-bottom:12px; font-size:15px;">📜 เลือกจุดเริ่มต้นชะตากรรม</h3>
                ${optionsHtml}
                <button class="ui-btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.ui-modal-bg').remove()">ยกเลิก</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function p14SaveOrigin(idx, btn) {
        p14Char.originObj = p14Origins[idx];
        btn.closest('.ui-modal-bg').remove();
        renderP14SetupScreen();
    }

    function p14OpenFamilyModal() {
        let overlay = document.createElement('div');
        overlay.className = 'ui-modal-bg';
        let optionsHtml = p14BirthOrders.map((bo, idx) => `
            <button class="ui-option-row" onclick="p14SaveFamily(${idx}, this)">
                <b>${bo}</b>
            </button>
        `).join('');
        overlay.innerHTML = `
            <div class="ui-modal-pane">
                <h3 style="color:var(--primary); margin-bottom:12px; font-size:15px;">👨‍👩‍👧 เลือกสถานะครอบครัว</h3>
                ${optionsHtml}
                <button class="ui-btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.ui-modal-bg').remove()">ยกเลิก</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function p14SaveFamily(idx, btn) {
        p14Char.birthOrder = p14BirthOrders[idx];
        let famList = [
            { role: "บิดา", name: p14Char.surname + " เทียน", age: 42, career: 'ขุนนางผู้ใหญ่' },
            { role: "มารดา", name: "ฮูหยินตระกูล " + p14Char.surname, age: 38, career: 'นายหญิงตระกูลขุนนาง' }
        ];
        if (p14Char.birthOrder !== "ลูกคนเดียวในจวน") {
            famList.push({ role: p14Char.birthOrder.includes("คนโต") ? "น้องรอง" : "พี่ใหญ่", name: p14Char.surname + " ชิง", age: 12, career: "ทายาทในจวน" });
        }
        p14Char.familyMembers = famList;
        btn.closest('.ui-modal-bg').remove();
        renderP14SetupScreen();
    }

    window.addEventListener('load', function() {
        setTimeout(() => { p14RandomizeAll(); }, 200);
    });

    function p14StartGame() {
        game.surname = p14Char.surname;
        game.firstname = p14Char.firstname;
        game.gender = p14Char.gender;
        game.money = p14Char.money;
        game.stats = { ...p14Char.stats };
        game.pathType = p14Char.originObj.path;

        if(game.pathType === 'ทาส') {
            game.career = "ทาสรับใช้ในจวนตระกูลใหญ่";
        } else if(game.pathType === 'แม่ทัพ') {
            game.career = "ทายาทค่ายทหารชายแดน";
        } else if(game.pathType === 'ตกอับ') {
            game.isFramed = true;
            game.career = "อดีตทายาทขุนนางถูกใส่ร้าย";
        } else if(game.pathType === 'วังหลัง') {
            game.career = "โฉมงามตระกูลสูง";
        } else if(game.pathType === 'พ่อค้า') {
            game.career = "ทายาทคหบดีใหญ่";
        } else {
            game.career = "บุตรขุนนางสำนักหลวง";
        }

        game.chronicleLog.push({
            year: 1,
            age: 0,
            title: `จุติสู่แผ่นดิน ${p14Char.dynasty}`,
            text: `ฟ้าลิขิตให้กำเนิดในยุค [${p14Char.dynasty}] เส้นทางชะตา [${p14Char.originObj.title}] สถานะ: ${p14Char.birthOrder} (${p14Char.zodiac}) บิดาคือ ${p14Char.familyMembers[0].name} นามว่า ${game.surname} ${game.firstname} (${game.gender}) เริ่มต้นบันทึกมหากาพย์ชีวิตแล้ว!`
        });

        let setupScreen = document.getElementById('setup-screen');
        if(setupScreen) setupScreen.style.display = 'none';

        let dynastyHeader = document.getElementById('header-dynasty');
        if(dynastyHeader) dynastyHeader.innerText = `${p14Char.dynasty.split(' ')[0]} | ${game.career}`;

        saveGame();
        updateScreen();
    }
</script>
</body>
</html>
