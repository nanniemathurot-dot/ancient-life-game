<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Dynasty Life Simulator - Master Edition</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-dark: #4a0000;
            --gold: #d4af37;
            --gold-light: #fdfbf7;
            --bg-main: #f4f1ea;
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --border-color: #dcd6c8;
            --danger-red: #a93226;
            --success-green: #1e8449;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background: var(--bg-main); color: var(--text-dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- SETUP SCREEN (CHARACTER CREATION) --- */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .setup-card {
            background: #fff; width: 100%; max-width: 480px; border-radius: 20px; padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); border-top: 6px solid var(--gold); text-align: center;
        }
        .setup-card h2 { color: var(--primary); margin-bottom: 8px; font-size: 22px; font-weight: bold; }
        .setup-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-control:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,175,55,0.3); }
        .btn-start {
            width: 100%; background: linear-gradient(135deg, var(--gold), #b89728); color: #1a1a1a;
            border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(212,175,55,0.4); transition: 0.2s; margin-top: 10px;
        }
        .btn-start:active { transform: scale(0.97); }

        /* --- STICKY HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--gold-light); padding: 14px 22px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 4px 18px rgba(0,0,0,0.4); z-index: 25;
            border-bottom: 3px solid var(--gold);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { background: none; border: none; color: var(--gold); font-size: 28px; cursor: pointer; transition: transform 0.2s; }
        .menu-btn:active { transform: scale(0.85); }
        .avatar-box { font-size: 34px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 12px; border: 1.5px solid var(--gold); }
        .header-info h1 { font-size: 16px; color: var(--gold); font-weight: bold; letter-spacing: 0.5px; }
        .header-info p { font-size: 11px; color: #fff; opacity: 0.95; margin-top: 2px; }
        .header-right { text-align: right; font-size: 11px; color: var(--gold-light); line-height: 1.4; }

        /* --- LEFT OFF-CANVAS DRAWER --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; display: none; backdrop-filter: blur(3px);
        }
        .drawer-overlay.active { display: block; }
        .left-drawer {
            position: fixed; top: 0; left: -320px; width: 320px; height: 100%;
            background: #fff; z-index: 101; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: left 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column;
        }
        .left-drawer.active { left: 0; }
        .drawer-header { background: var(--primary); color: var(--gold); padding: 20px; font-weight: bold; font-size: 17px; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 18px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .drawer-btn { background: #fdfbf7; border: 1px solid var(--border-color); padding: 13px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: left; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .drawer-btn:hover { background: var(--gold-light); border-color: var(--gold); color: var(--primary); transform: translateX(5px); }

        /* --- MAIN CONTAINER & CARDS (ONE MORE LIFE CLEAN UI) --- */
        main {
            flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
            padding-bottom: 130px; scroll-behavior: smooth;
        }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-left: 5px solid var(--primary);
            border: 1px solid #e8e2d0; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .card h3 { font-size: 15px; color: var(--primary); margin-bottom: 12px; border-bottom: 1.5px solid #f0ece1; padding-bottom: 6px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; }
        .status-item { background: #faf8f2; padding: 12px; border-radius: 10px; border: 1px solid #e8e2d0; }

        /* --- ACTION BUTTONS --- */
        .action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 6px; }
        .btn-action {
            background: #fff; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 13px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: left;
            font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 2px 6px rgba(139,0,0,0.04);
        }
        .btn-action:hover { background: var(--primary); color: #fff; transform: scale(1.01); }

        /* --- ADVANCE YEAR BUTTON --- */
        .advance-container {
            position: fixed; bottom: 75px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 15; pointer-events: none;
        }
        .btn-advance {
            pointer-events: auto;
            background: linear-gradient(135deg, var(--gold), #b89728); color: #1a1a1a;
            border: none; padding: 14px 40px; border-radius: 35px; font-weight: bold;
            font-size: 15px; box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); cursor: pointer;
            transition: all 0.15s ease; border: 1.5px solid #fff;
        }
        .btn-advance:active { transform: scale(0.95); }

        /* --- BOTTOM NAVIGATION BAR --- */
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 62px;
            background: #fff; border-top: 2px solid var(--border-color); display: flex; justify-content: space-around;
            align-items: center; z-index: 20; box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }
        .nav-item {
            background: none; border: none; font-size: 11px; color: #666; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 2px; flex-grow: 1;
            transition: 0.2s; padding: 5px 0; font-weight: 600;
        }
        .nav-item.active { color: var(--primary); font-weight: bold; transform: translateY(-2px); }
        .nav-icon { font-size: 20px; }

        /* --- MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 200; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; width: 90%; max-width: 450px; border-radius: 16px; padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; border-top: 5px solid var(--primary);
        }
        .modal-box h2 { color: var(--primary); margin-bottom: 12px; font-size: 18px; font-weight: bold; }
        .modal-box p { font-size: 13px; margin-bottom: 20px; color: #333; line-height: 1.6; text-align: left; max-height: 280px; overflow-y: auto; }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- STARTUP CHARACTER SETUP SCREEN -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>📜 สร้างตัวละคร & กำหนดจุดเริ่มต้น</h2>
            <p>โปรดกรอกข้อมูลพื้นเพเพื่อเริ่มต้นมหากาพย์ชีวิตในราชสำนัก</p>
            <div class="form-group">
                <label>นามสกุลตระกูล:</label>
                <input type="text" id="input-surname" class="form-control" value="มู่หรง">
            </div>
            <div class="form-group">
                <label>ชื่อจริงตัวละคร:</label>
                <input type="text" id="input-firstname" class="form-control" value="เฟิ่ง">
            </div>
            <div class="form-group">
                <label>เลือกสถานะชนชั้นเริ่มต้น:</label>
                <select id="input-origin" class="form-control">
                    <option value="ตระกูลขุนนางเก่าแก่แห่งราชสำนัก">ตระกูลขุนนางเก่าแก่ (โบนัสสติปัญญา & ชื่อเสียง)</option>
                    <option value="ตระกูลแม่ทัพผู้พิทักษ์ชายแดน">ตระกูลแม่ทัพชายแดน (โบนัสพลังยุทธ์)</option>
                    <option value="ตระกูลมหาเศรษฐีผู้มั่งคั่ง">ตระกูลมหาเศรษฐี (โบนัสเงินทองตั้งต้น)</option>
                </select>
            </div>
            <button class="btn-start" onclick="initGameSession()">🚀 เริ่มต้นตำนานตระกูล</button>
        </div>
    </div>

    <!-- STICKY HEADER -->
    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
            <div class="avatar-box" id="header-avatar">🎓</div>
            <div class="header-info">
                <h1 id="header-name">มู่หรง เฟิ่ง</h1>
                <p id="header-dynasty">ราชวงศ์ต้าเซี่ย | รัชศกไท่คัง ปีที่ 1</p>
            </div>
        </div>
        <div class="header-right">
            <div id="header-season">🌸 ฤดูใบไม้ผลิ</div>
            <div id="header-age">อายุ 16 ปี</div>
        </div>
    </header>

    <!-- LEFT DRAWER -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
    <div class="left-drawer" id="left-drawer">
        <div class="drawer-header">
            <span>🏛️ จัดการตระกูลขั้นสูง</span>
            <span style="cursor:pointer; font-size:18px;" onclick="toggleDrawer(false)">✕</span>
        </div>
        <div class="drawer-body">
            <button class="drawer-btn" onclick="openModal('pedigree')">📜 บันทึกพื้นเพ & ตระกูล</button>
            <button class="drawer-btn" onclick="openModal('shrine')">⛩️ วิหารบรรพบุรุษ (Legacy Buffs)</button>
            <button class="drawer-btn" onclick="openModal('chronicle')">📖 ม้วนพงศาวดารชีวิต</button>
            <button class="drawer-btn" onclick="saveGameManually()">💾 บันทึกเกม (Manual Save)</button>
            <button class="drawer-btn" onclick="resetGame()" style="color: var(--danger-red);">🔄 เริ่มเกมใหม่</button>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main id="main-content"></main>

    <!-- ADVANCE YEAR BUTTON -->
    <div class="advance-container">
        <button class="btn-advance" onclick="advanceYear()">⏳ ผ่านพ้นไปอีกปี (อายุ +1)</button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <button class="nav-item active" onclick="switchTab('life')" id="nav-life"><span class="nav-icon">📖</span>ชีวิต</button>
        <button class="nav-item" onclick="switchTab('court')" id="nav-court"><span class="nav-icon">🏛️</span>ราชสำนัก</button>
        <button class="nav-item" onclick="switchTab('family')" id="nav-family"><span class="nav-icon">🏠</span>จวน & ทายาท</button>
        <button class="nav-item" onclick="switchTab('festival')" id="nav-festival"><span class="nav-icon">🎆</span>เทศกาล</button>
        <button class="nav-item" onclick="switchTab('training')" id="nav-training"><span class="nav-icon">🏮</span>ฝึกตน</button>
    </nav>

    <!-- UNIVERSAL MODAL -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal-box">
            <h2 id="modal-title">แจ้งเตือน</h2>
            <p id="modal-desc">...</p>
            <button class="btn-primary" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        let game = {
            surname: "มู่หรง",
            firstname: "เฟิ่ง",
            origin: "ตระกูลขุนนางเก่าแก่",
            age: 16,
            year: 1,
            seasonIndex: 0,
            seasons: ["🌸 ฤดูใบไม้ผลิ", "☀️ ฤดูร้อน", "🍂 ฤดูใบไม้ร่วง", "❄️ ฤดูหนาว"],
            avatar: "🎓",
            title: "บัณฑิตสำนักศึกษาหลวง",
            money: 1500,
            stats: { intelligence: 70, combat: 45, charm: 60, prestige: 40 },
            trainingPoints: 5,
            maxTrainingPoints: 5,
            family: { parents: "บิดา-มารดาผู้ทรงอิทธิพล", siblings: "น้องชายร่วมสายเลือด", spouse: "ยังไม่ได้แต่งงาน", heirs: [] },
            rivals: ["ตระกูลขุนนางคู่แข่งจ้องเล่นงาน"],
            shrineBuffs: "+18% สติปัญญาและต้านทานภัยการเมือง",
            chronicleLog: ["เริ่มต้นบันทึกประวัติศาสตร์ตระกูลในราชสำนัก"],
            timeline: ["ปีที่ 1: เข้าศึกษาเตรียมสอบคัดเลือกขุนนางหลวง"],
            currentTab: "life"
        };

        function initGameSession() {
            let s = document.getElementById('input-surname').value.trim();
            let f = document.getElementById('input-firstname').value.trim();
            let o = document.getElementById('input-origin').value;
            if(s) game.surname = s;
            if(f) game.firstname = f;
            game.origin = o;
            if(o.includes("แม่ทัพ")) { game.stats.combat = 75; game.avatar = "⚔️"; }
            if(o.includes("เศรษฐี")) { game.money = 3000; game.avatar = "💰"; }
            
            document.getElementById('setup-screen').style.display = 'none';
            updateScreen();
        }

        function updateScreen() {
            document.getElementById('header-name').innerText = `${game.surname} ${game.firstname}`;
            document.getElementById('header-avatar').innerText = game.avatar;
            document.getElementById('header-age').innerText = `อายุ ${game.age} ปี`;
            document.getElementById('header-season').innerText = game.seasons[game.seasonIndex];

            let container = document.getElementById('main-content');
            container.innerHTML = "";

            if (game.currentTab === 'life') {
                container.innerHTML = `
                    <div class="card">
                        <h3>📊 สเตตัสตัวละคร & ทรัพยากร</h3>
                        <div class="status-grid">
                            <div class="status-item"><b>ยศ:</b> ${game.title}</div>
                            <div class="status-item"><b>เงิน:</b> 💰 ${game.money} ตำลึง</div>
                            <div class="status-item"><b>สติปัญญา:</b> 📖 ${game.stats.intelligence}</div>
                            <div class="status-item"><b>พลังยุทธ์:</b> ⚔️ ${game.stats.combat}</div>
                            <div class="status-item"><b>เสน่ห์:</b> 🌸 ${game.stats.charm}</div>
                            <div class="status-item"><b>ชื่อเสียง:</b> 🌟 ${game.stats.prestige}</div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>⚡ ไทม์ไลน์บันทึกประวัติชีวิต</h3>
                        <div style="font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;">
                            ${game.timeline.slice().reverse().map(item => `<div>• ${item}</div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'court') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏛️ ราชสำนัก & เส้นทางอาชีพ</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="takeExam()">📖 สอบจอหงวน (สายบุ๋น)</button>
                            <button class="btn-action" onclick="joinMilitary()">⚔️ สมัครเป็นแม่ทัพ (สายบู๊)</button>
                            <button class="btn-action" onclick="openMerchant()">💰 เปิดกิจการค้าขายสร้างความมั่งคั่ง</button>
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'family') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏠 จวนตระกูล & ทายาท</h3>
                        <div style="font-size: 13px; margin-bottom: 12px; display:flex; flex-direction:column; gap:6px;">
                            <div><b>คู่ครอง:</b> ${game.family.spouse}</div>
                            <div><b>ทายาทในจวน:</b> ${game.family.heirs.length} คน</div>
                        </div>
                        <button class="btn-action" onclick="arrangeMarriage()">💍 ขอแต่งงาน / รับฮูหยินเข้าจวน</button>
                        <button class="btn-action" onclick="adoptOrHaveChild()" style="margin-top:8px;">🐣 ให้กำเนิดทายาทสืบสกุล</button>
                    </div>
                `;
            } else if (game.currentTab === 'festival') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🎆 เทศกาลประจำปี</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="triggerFestival('ตรุษจีน')">🧧 เฉลิมฉลองตรุษจีนรับอั่งเปา</button>
                            <button class="btn-action" onclick="triggerFestival('หยวนเซียว')">🏮 เที่ยวงานโคมไฟหยวนเซียว</button>
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'training') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏮 ศูนย์ฝึกตนประจำปี (โควตา: ${game.trainingPoints}/${game.maxTrainingPoints})</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="doTraining('study')">📖 อ่านตำรา (+สติปัญญา)</button>
                            <button class="btn-action" onclick="doTraining('combat')">⚔️ ฝึกยุทธ์ (+พลังต่อสู้)</button>
                            <button class="btn-action" onclick="doTraining('trade')">🪙 ค้าขายทำกำไร (+เงิน)</button>
                        </div>
                    </div>
                `;
            }
        }

        function advanceYear() {
            game.age += 1;
            game.year += 1;
            game.seasonIndex = (game.seasonIndex + 1) % 4;
            game.trainingPoints = game.maxTrainingPoints;
            game.money -= 100;
            game.timeline.push(`ปีที่ ${game.year}: อายุเข้าสู่ ${game.age} ปี หักค่าใช้จ่ายในจวน 100 ตำลึง`);
            updateScreen();
        }

        function doTraining(type) {
            if(game.trainingPoints <= 0) { showModal("เหนื่อยล้า", "ปีนี้หมดโควตาฝึกฝนแล้ว โปรดกดผ่านปีถัดไป"); return; }
            game.trainingPoints--;
            let gain = Math.floor(Math.random() * 15) + 5;
            if(type === 'study') game.stats.intelligence += gain;
            else if(type === 'combat') game.stats.combat += gain;
            else game.money += gain * 30;
            updateScreen();
        }

        function takeExam() {
            if(game.stats.intelligence >= 80) { game.title = "จอหงวนเอก"; game.money += 1000; showModal("สำเร็จ!", "สอบผ่านได้เป็นจอหงวนหลวง!"); }
            else showModal("ไม่ผ่าน", "สติปัญหายังไม่ถึง 80");
            updateScreen();
        }
        function joinMilitary() { game.title = "แม่ทัพใหญ่"; game.stats.combat += 30; showModal("สำเร็จ", "ได้เป็นแม่ทัพคุมกำลังพล!"); updateScreen(); }
        function openMerchant() { game.money += 600; showModal("สำเร็จ", "กิจการค้าขายรุ่งเรือง!"); updateScreen(); }
        function arrangeMarriage() { game.family.spouse = "ฮูหยินตระกูลใหญ่"; showModal("มงคลสมรส", "รับฮูหยินเข้าจวนเรียบร้อย"); updateScreen(); }
        function adoptOrHaveChild() { game.family.heirs.push({name: "ทายาทรุ่นเยาว์"}); showModal("ยินดีด้วย", "ให้กำเนิดทายาทสืบสกุลสำเร็จ"); updateScreen(); }
        function triggerFestival(name) { game.money += 200; showModal(name, "ร่วมเฉลิมฉลองมีความสุขและได้รับอั่งเปา"); updateScreen(); }

        function toggleDrawer(open) {
            document.getElementById('left-drawer').classList.toggle('active', open);
            document.getElementById('drawer-overlay').classList.toggle('active', open);
        }
        function switchTab(tab) { game.currentTab = tab; document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active')); document.getElementById('nav-'+tab).classList.add('active'); updateScreen(); }
        function showModal(title, desc) { document.getElementById('modal-title').innerText = title; document.getElementById('modal-desc').innerText = desc; document.getElementById('game-modal').classList.add('active'); }
        function closeModal() { document.getElementById('game-modal').classList.remove('active'); }
        function saveGameManually() { showModal("บันทึก", "บันทึกเกมเรียบร้อย"); }
        function resetGame() { if(confirm("เริ่มใหม่ทั้งหมด?")) location.reload(); }
        function openModal(type) { toggleDrawer(false); showModal("ข้อมูล", "จัดการระบบตระกูลและวิหารบรรพบุรุษ"); }
    </script>
</body>
</html>
