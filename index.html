<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Dynasty Life Simulator - Master Edition</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-dark: #4a0000;
            --gold: #d4af37;
            --gold-light: #f9f3cc;
            --bg-main: #f4f1ea;
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --border-color: #dcd6c8;
            --danger-red: #a93226;
            --success-green: #1e8449;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background: var(--bg-main); color: var(--text-dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- STICKY HEADER & DYNAMIC AVATAR --- */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--gold-light);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            z-index: 25;
            border-bottom: 3px solid var(--gold);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { background: none; border: none; color: var(--gold); font-size: 28px; cursor: pointer; transition: transform 0.2s; }
        .menu-btn:active { transform: scale(0.85); }
        .avatar-box { font-size: 36px; background: rgba(255,255,255,0.15); padding: 5px 14px; border-radius: 14px; border: 1.5px solid var(--gold); box-shadow: inset 0 2px 8px rgba(0,0,0,0.3); }
        .header-info h1 { font-size: 17px; color: var(--gold); font-weight: bold; letter-spacing: 0.8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .header-info p { font-size: 11px; color: #fff; opacity: 0.95; margin-top: 2px; }
        .header-right { text-align: right; font-size: 11px; color: var(--gold-light); line-height: 1.4; }

        /* --- LEFT OFF-CANVAS DRAWER MENU --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; display: none; backdrop-filter: blur(3px);
            animation: fadeIn 0.3s ease;
        }
        .drawer-overlay.active { display: block; }
        .left-drawer {
            position: fixed; top: 0; left: -320px; width: 320px; height: 100%;
            background: #fff; z-index: 101; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: left 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column;
        }
        .left-drawer.active { left: 0; }
        .drawer-header { background: var(--primary); color: var(--gold); padding: 22px; font-weight: bold; font-size: 18px; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .drawer-btn { background: #fdfbf7; border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; text-align: left; font-size: 13px; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 10px; }
        .drawer-btn:hover { background: var(--gold-light); border-color: var(--gold); color: var(--primary); transform: translateX(6px); }

        /* --- MAIN CONTAINER & SYSTEM CARDS --- */
        main {
            flex-grow: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
            padding-bottom: 130px; scroll-behavior: smooth;
        }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08); border-left: 6px solid var(--primary);
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e8e2d0;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .card h3 { font-size: 16px; color: var(--primary); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #eee; padding-bottom: 8px; font-weight: bold; }
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 13px; }
        .status-item { background: #faf8f2; padding: 13px; border-radius: 12px; border: 1px solid #e8e2d0; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02); }

        /* --- ACTION & INTERACTION BUTTONS --- */
        .action-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 8px; }
        .btn-action {
            background: #fff; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 14px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: left;
            font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 3px 8px rgba(139,0,0,0.06);
        }
        .btn-action:hover { background: var(--primary); color: #fff; transform: scale(1.01); box-shadow: 0 5px 15px rgba(139,0,0,0.2); }

        /* --- FLOATING ADVANCE YEAR BUTTON --- */
        .advance-container {
            position: fixed; bottom: 78px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 15; pointer-events: none;
        }
        .btn-advance {
            pointer-events: auto;
            background: linear-gradient(135deg, var(--gold), #b89728); color: #1a1a1a;
            border: none; padding: 15px 45px; border-radius: 40px; font-weight: bold;
            font-size: 16px; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.55); cursor: pointer;
            transition: all 0.15s ease; border: 1.5px solid #fff; letter-spacing: 0.5px;
        }
        .btn-advance:active { transform: scale(0.94); box-shadow: 0 3px 12px rgba(212, 175, 55, 0.3); }

        /* --- BOTTOM NAVIGATION BAR --- */
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #fff; border-top: 2px solid var(--border-color); display: flex; justify-content: space-around;
            align-items: center; z-index: 20; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .nav-item {
            background: none; border: none; font-size: 11px; color: #666; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 3px; flex-grow: 1;
            transition: 0.2s; padding: 6px 0; font-weight: 600;
        }
        .nav-item.active { color: var(--primary); font-weight: bold; transform: translateY(-3px); }
        .nav-icon { font-size: 22px; }

        /* --- UNIVERSAL MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 200; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; width: 92%; max-width: 480px; border-radius: 18px; padding: 26px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.45); text-align: center; border-top: 6px solid var(--primary);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .modal-box h2 { color: var(--primary); margin-bottom: 14px; font-size: 20px; font-weight: bold; }
        .modal-box p { font-size: 14px; margin-bottom: 24px; color: #333; line-height: 1.7; text-align: left; max-height: 300px; overflow-y: auto; padding-right: 6px; }
        .modal-actions { display: flex; gap: 14px; justify-content: center; }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 11px 26px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 3px 10px rgba(139,0,0,0.2); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--border-color); color: #2c2c2c; border: none; padding: 11px 26px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-secondary:hover { background: #c5bdae; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(35px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
<!-- STICKY HEADER -->
    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
            <div class="avatar-box" id="header-avatar">🎓</div>
            <div class="header-info">
                <h1 id="header-name">มู่หรง เฟิ่ง</h1>
                <p id="header-dynasty">ราชวงศ์ต้าเซี่ย | รัชศกไท่คัง ปีที่ 1</p>
            </div>
        </div>
        <div class="header-right">
            <div id="header-season">🌸 ฤดูใบไม้ผลิ</div>
            <div id="header-age">อายุ 16 ปี</div>
        </div>
    </header>

    <!-- LEFT OFF-CANVAS DRAWER -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
    <div class="left-drawer" id="left-drawer">
        <div class="drawer-header">
            <span>🏛️ จัดการตระกูลขั้นสูง</span>
            <span style="cursor:pointer; font-size:20px;" onclick="toggleDrawer(false)">✕</span>
        </div>
        <div class="drawer-body">
            <button class="drawer-btn" onclick="openModal('pedigree')">📜 ดูพื้นเพ & บันทึกตระกูลเชิงลึก</button>
            <button class="drawer-btn" onclick="openModal('shrine')">⛩️ วิหารบรรพบุรุษ (Legacy Buffs)</button>
            <button class="drawer-btn" onclick="openModal('chronicle')">📖 ม้วนพงศาวดารชีวิตตระกูล</button>
            <button class="drawer-btn" onclick="openModal('settings')">⚙️ ตั้งค่าชื่อ & นามสกุลอิสระ</button>
            <button class="drawer-btn" onclick="saveGameManually()">💾 บันทึกเกมด้วยตนเอง (Manual Save)</button>
            <button class="drawer-btn" onclick="resetGame()" style="color: var(--danger-red);">🔄 เริ่มเกมใหม่ทั้งหมด</button>
        </div>
    </div>

    <!-- MAIN CONTAINER (DYNAMIC MODULE RENDERING) -->
    <main id="main-content"></main>

    <!-- FLOATING ADVANCE YEAR BUTTON -->
    <div class="advance-container">
        <button class="btn-advance" onclick="advanceYear()">⏳ ผ่านพ้นไปอีกปี (อายุ +1)</button>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav>
        <button class="nav-item active" onclick="switchTab('life')" id="nav-life"><span class="nav-icon">📖</span>ชีวิต</button>
        <button class="nav-item" onclick="switchTab('court')" id="nav-court"><span class="nav-icon">🏛️</span>ราชสำนัก</button>
        <button class="nav-item" onclick="switchTab('family')" id="nav-family"><span class="nav-icon">🏠</span>จวน & ทายาท</button>
        <button class="nav-item" onclick="switchTab('festival')" id="nav-festival"><span class="nav-icon">🎆</span>เทศกาล</button>
        <button class="nav-item" onclick="switchTab('training')" id="nav-training"><span class="nav-icon">🏮</span>ฝึกตน</button>
    </nav>

    <!-- UNIVERSAL MODAL -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal-box">
            <h2 id="modal-title">หัวข้อแจ้งเตือน</h2>
            <p id="modal-desc">รายละเอียด...</p>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-primary" onclick="closeModal()">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        // --- 8 CORE MODULES & DEEP DATABASE ENGINE ---
        let game = {
            surname: "มู่หรง",
            firstname: "เฟิ่ง",
            origin: "ตระกูลขุนนางเก่าแก่แห่งราชสำนักต้าเซี่ย",
            age: 16,
            year: 1,
            seasonIndex: 0,
            seasons: ["🌸 ฤดูใบไม้ผลิ", "☀️ ฤดูร้อน", "🍂 ฤดูใบไม้ร่วง", "❄️ ฤดูหนาว"],
            avatar: "🎓",
            title: "บัณฑิตสำนักศึกษาหลวง",
            money: 1200,
            stats: {
                intelligence: 70,
                combat: 45,
                charm: 60,
                prestige: 40
            },
            trainingPoints: 5,
            maxTrainingPoints: 5,
            family: {
                parents: "ท่านพ่อ (อดีตเสนาบดีคลังหลวงผู้ทรงอิทธิพล) & ท่านแม่ (คุณหญิงตระกูลหลินผู้เพียบพร้อม)",
                siblings: "น้องชาย (มู่หรงหยุน - กำลังศึกษาเตรียมสอบคัดเลือกจอหงวนสำนักหลวง)",
                spouse: "ยังไม่ได้แต่งงาน (โสดสนิท)",
                heirs: []
            },
            rivals: ["ตระกูลเสนาบดีหลี่ (ศัตรูคู่อาฆาตจ้องแทงข้างหลังในราชสำนักและส่งมือสังหารลอบปองร้าย)"],
            shrineBuffs: "+18% สติปัญญา โชคลาภ และต้านทานภัยการเมือง (พรสวรรค์ตกทอดจากป้ายวิหารบรรพบุรุษ)",
            chronicleLog: [
                "ปีที่ 1: มู่หรงเฟิ่ง เริ่มต้นชีวิตในวัย 16 ปี เตรียมตัวฝึกฝนตนเองเพื่อสอบจอหงวนและกอบกู้เกียรติยศวงศ์ตระกูล"
            ],
            timeline: [
                "ปีที่ 1: เข้าศึกษาตำราปราชญ์โบราณ เตรียมตัวก้าวสู่สนามสอบขุนนางในราชสำนักต้าเซี่ย"
            ],
            currentTab: "life"
        };
        // --- DYNAMIC SCREEN RENDERER (8 MODULES DISPLAY) ---
        function updateScreen() {
            document.getElementById('header-name').innerText = `${game.surname} ${game.firstname}`;
            document.getElementById('header-avatar').innerText = game.avatar;
            document.getElementById('header-age').innerText = `อายุ ${game.age} ปี`;
            document.getElementById('header-season').innerText = game.seasons[game.seasonIndex];

            let container = document.getElementById('main-content');
            container.innerHTML = "";

            if (game.currentTab === 'life') {
                container.innerHTML = `
                    <div class="card">
                        <h3>📊 สเตตัสตัวละคร & ทรัพยากรตระกูล (Module 1 & 7)</h3>
                        <div class="status-grid">
                            <div class="status-item"><b>ยศตำแหน่ง:</b> ${game.title}</div>
                            <div class="status-item"><b>คลังเงิน:</b> 💰 ${game.money} ตำลึง</div>
                            <div class="status-item"><b>สติปัญญา:</b> 📖 ${game.stats.intelligence}</div>
                            <div class="status-item"><b>พลังยุทธ์:</b> ⚔️ ${game.stats.combat}</div>
                            <div class="status-item"><b>เสน่ห์บารมี:</b> 🌸 ${game.stats.charm}</div>
                            <div class="status-item"><b>ชื่อเสียงตระกูล:</b> 🌟 ${game.stats.prestige}</div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>⚡ ไทม์ไลน์บันทึกประวัติชีวิต Real-time (Module 5)</h3>
                        <div style="font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 6px;">
                            ${game.timeline.slice().reverse().map(item => `<div>• ${item}</div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'court') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏛️ ราชสำนัก & เส้นทางอาชีพหลัก (Module 2)</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="takeExam()">📖 สอบจอหงวน (สายบุ๋น ไต่เต้า 6 กรมราชสำนัก)</button>
                            <button class="btn-action" onclick="joinMilitary()">⚔️ สมัครเป็นแม่ทัพ (สายบู๊ นำทัพรบชายแดน)</button>
                            <button class="btn-action" onclick="enterHarem()">🌸 ถวายตัวเข้าคัดเลือกนางในวังหลัง</button>
                            <button class="btn-action" onclick="openMerchant()">💰 เปิดกิจการค้าขายส่วนตัวสร้างความมั่งคั่ง</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>🥷 ภัยการเมือง & ศัตรูคู่อาฆาต (Premium Feature)</h3>
                        <p style="font-size: 13px; color: var(--danger-red); margin-bottom: 10px;"><b>ตระกูลคู่แข่ง:</b> ${game.rivals.join(', ')}</p>
                        <button class="btn-action" onclick="bribeRival()">💸 ติดสินบน/เจรจาสงบศึกกับศัตรู (-180 ตำลึง)</button>
                    </div>
                `;
            } else if (game.currentTab === 'family') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏠 จวนตระกูล & เครือญาติ (Module 3)</h3>
                        <div style="font-size: 13px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px;">
                            <div><b>พ่อ-แม่:</b> ${game.family.parents}</div>
                            <div><b>พี่น้อง:</b> ${game.family.siblings}</div>
                            <div><b>คู่ครอง:</b> ${game.family.spouse}</div>
                        </div>
                        <button class="btn-action" onclick="arrangeMarriage()">💍 สู่ขอแต่งงาน / รับฮูหยินหรืออนุภรรยาเข้าจวน</button>
                    </div>
                    <div class="card">
                        <h3>👶 ทายาทสืบสกุล & ปั้นลูกหลาน</h3>
                        <p style="font-size: 13px; margin-bottom: 10px;">จำนวนทายาทในจวน: <b>${game.family.heirs.length} คน</b></p>
                        <button class="btn-action" onclick="adoptOrHaveChild()">🐣 ให้กำเนิดทายาท / รับบุตรบุญธรรมสืบสกุล</button>
                    </div>
                `;
            } else if (game.currentTab === 'festival') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🎆 เทศกาล & ประเพณีโบราณตามฤดูกาล (Module 4)</h3>
                        <div class="action-grid">
                            <button class="btn-action" onclick="triggerFestival('ตรุษจีน')">🧧 เฉลิมฉลองตรุษจีน (ไหว้บรรพบุรุษรับอั่งเปา)</button>
                            <button class="btn-action" onclick="triggerFestival('หยวนเซียว')">🏮 เที่ยวงานโคมไฟเทศกาลหยวนเซียว</button>
                            <button class="btn-action" onclick="triggerFestival('จวนอู่')">🛶 แข่งเรือมังกรเทศกาลบะจ่างหลวง</button>
                            <button class="btn-action" onclick="triggerFestival('ไหว้พระจันทร์')">🥮 ชมจันทร์จิบชาร่ำสุราร่วมกับครอบครัว</button>
                        </div>
                    </div>
                `;
            } else if (game.currentTab === 'training') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏮 ศูนย์ฝึกตน & โควตาพลังงานประจำปี (Module 6)</h3>
                        <p style="font-size: 13px; margin-bottom: 12px; color: var(--primary);"><b>โควตาฝึกฝนปีนี้:</b> ${game.trainingPoints} / ${game.maxTrainingPoints} ครั้ง</p>
                        <div class="action-grid">
                            <button class="btn-action" onclick="doTraining('study')">📖 อ่านตำราปราชญ์โบราณ (+สติปัญญา)</button>
                            <button class="btn-action" onclick="doTraining('combat')">⚔️ ฝึกฟันดาบ & พิชัยสงคราม (+พลังยุทธ์)</button>
                            <button class="btn-action" onclick="doTraining('art')">🎶 ดีดพิณ & วาดภาพสุนทรียะ (+เสน่ห์)</button>
                            <button class="btn-action" onclick="doTraining('trade')">🪙 ศึกษาตำราคาค้าขายตระกูล (+เงินทอง)</button>
                        </div>
                    </div>
                `;
            }
        }

        // --- CORE GAME MECHANICS & DYNAMIC SIMULATION ---
        function advanceYear() {
            game.age += 1;
            game.year += 1;
            game.seasonIndex = (game.seasonIndex + 1) % 4;
            game.trainingPoints = game.maxTrainingPoints;
            
            let livingCost = 120; // Module 7: ค่าครองชีพรายปีในจวน
            game.money -= livingCost;

            if (game.money < 0) {
                game.money = 0;
                game.stats.prestige -= 30;
                game.timeline.push(`ปีที่ ${game.year}: คลังเงินจวนหมดเกลี้ยง ตระกูลตกอับเป็นหนี้สินรุงรัง!`);
            } else {
                game.timeline.push(`ปีที่ ${game.year}: เข้าสู่อายุ ${game.age} ปี หักค่าใช้จ่ายในจวน ${livingCost} ตำลึง`);
            }

            if (Math.random() < 0.7) { // Module 8: เหตุการณ์สุ่มชะตากรรม & วิกฤตการณ์
                triggerRandomEvent();
            }

            saveGame();
            updateScreen();
        }

        function doTraining(type) {
            if (game.trainingPoints <= 0) {
                showModal("ร่างกายเหนื่อยล้าเกินไป", "ปีนี้ท่านตรากตรำฝึกฝนอย่างหนักหน่วงจนหมดแรงแล้ว! โปรดกดปุ่ม <b>'ผ่านพ้นไปอีกปี'</b> ด้านล่างเพื่อพักผ่อนและรอเข้าสู่ปีถัดไปตามเนื้อเรื่อง");
                return;
            }

            game.trainingPoints -= 1;
            let gain = Math.floor(Math.random() * 16) + 7;

            if (type === 'study') {
                game.stats.intelligence += gain;
                game.timeline.push(`ศึกษาตำราปราชญ์โบราณอย่างมุ่งมั่น ได้รับสติปัญญา +${gain}`);
            } else if (type === 'combat') {
                game.stats.combat += gain;
                game.timeline.push(`ฝึกวิชาอาวุธและยุทธ์ศาสตร์ ได้รับพลังยุทธ์ +${gain}`);
            } else if (type === 'art') {
                game.stats.charm += gain;
                game.timeline.push(`ฝึกฝนศิลปะดนตรีสุนทรียะ ได้รับเสน่ห์บารมี +${gain}`);
            } else if (type === 'trade') {
                let profit = gain * 35;
                game.money += profit;
                game.timeline.push(`ลงทุนค้าขายได้กำไรสุทธิเข้าจวน +${profit} ตำลึง`);
            }

            saveGame();
            updateScreen();
        }
       function takeExam() {
            if (game.stats.intelligence >= 90) {
                game.title = "จอหงวนเอกผู้ปราดเปรื่องแห่งราชสำนักต้าเซี่ย";
                game.avatar = "🎓";
                game.money += 1000;
                game.stats.prestige += 60;
                showModal("สอบผ่านจอหงวน!", "ท่านทำคะแนนสอบหน้าพระพักตร์เป็นเลิศ ได้รับแต่งตั้งเป็นจอหงวนสำนักหลวง พร้อมรางวัล 1,000 ตำลึง!");
            } else {
                showModal("สอบไม่ผ่านเกณฑ์", "สติปัญญาของท่านยังไม่ถึง 90 ไปศึกษาในห้องหนังสือเพิ่มพูนปัญญาด่วน!");
            }
            updateScreen();
        }

        function joinMilitary() {
            if (game.stats.combat >= 80) {
                game.title = "แม่ทัพใหญ่พิทักษ์แผ่นดินต้าเซี่ย";
                game.avatar = "⚔️";
                game.stats.prestige += 70;
                showModal("ชัยชนะเกริกไกร", "ท่านนำทัพออกศึกปราบกบฏชายแดนราบคาบ ได้รับพระราชทานบรรดาศักดิ์แม่ทัพใหญ่!");
            } else {
                showModal("พลังยุทธ์ไม่พอ", "พลังต่อสู้ของท่านยังไม่ถึง 80 ไปฝึกวรยุทธ์ที่ศูนย์ฝึกตนก่อน!");
            }
            updateScreen();
        }

        function enterHarem() {
            game.title = "พระสนมเอกผู้เลอโฉมแห่งวังหลัง";
            game.avatar = "👑";
            game.stats.charm += 45;
            showModal("เข้าสู่วังหลวง", "ท่านผ่านการคัดเลือกนางใน เป็นที่โปรดปรานและเริ่มกุมอำนาจในวังหลัง!");
            updateScreen();
        }

        function openMerchant() {
            game.title = "มหาเศรษฐีผู้มั่งคั่งที่สุดในเมืองหลวง";
            game.money += 850;
            game.avatar = "💰";
            showModal("อาณาจักรค้าขายเติบโต", "ท่านขยายกิจการโรงเตี๊ยมและร้านค้าทั่วเมือง ทำกำไรมหาศาลเข้าคลังตระกูล!");
            updateScreen();
        }

        function arrangeMarriage() {
            game.family.spouse = "ฮูหยินตระกูลขุนนางใหญ่ (สตรีผู้เพียบพร้อมด้วยกิริยามารยาท)";
            game.stats.charm += 35;
            showModal("พิธีมงคลสมรส", "ท่านจัดงานแต่งงานยิ่งใหญ่ รับฮูหยินเข้าจวน สร้างเครือข่ายพันธมิตรตระกูลแน่นแฟ้น!");
            updateScreen();
        }

        function adoptOrHaveChild() {
            let name = prompt("ตั้งชื่อให้ทายาทในจวน:", "เป่าเปา");
            if (name) {
                game.family.heirs.push({ name: name, talent: "อัจฉริยะ" });
                game.chronicleLog.push(`ให้กำเนิดทายาทสืบสกุลนามว่า ${name}`);
                showModal("ทายาทถือกำเนิด", `ยินดีด้วย! ทายาทนามว่า "${name}" ถือกำเนิดในจวน มีพรสวรรค์สูงส่ง พร้อมรับไม้ต่อสืบทอดตระกูลในอนาคต`);
            }
            updateScreen();
        }

        function triggerFestival(name) {
            game.money += 350;
            game.stats.prestige += 25;
            showModal(`เฉลิมฉลอง ${name}`, `ท่านเข้าร่วมเทศกาล ${name} อย่างอบอุ่นกับครอบครัว ได้รับความสุขและเงินอั่งเปาขวัญถุง 350 ตำลึง`);
            updateScreen();
        }

        function triggerRandomEvent() {
            let evs = [
                { title: "ภัยแล้งและอุทกภัยครั้งใหญ่ในเมืองหลวง", desc: "เกิดภัยธรรมชาติชาวบ้านเดือดร้อน ท่านจะเปิดคลังข้าวตระกูลช่วยเหลือหรือไม่?", reward: "ชื่อเสียงตระกูลพุ่งสูง (+60 ชื่อเสียง)" },
                { title: "โชคลาภวาสนาเซียนเร้นกาย", desc: "ท่านบังเอิญช่วยเหลือยอดจอมยุทธ์เร้นกาย ได้รับมอบคัมภีร์วิชาลับโบราณล้ำค่า", reward: "พลังยุทธ์เพิ่มพูนก้าวกระโดด (+40 พลังยุทธ์)" }
            ];
            let ev = evs[Math.floor(Math.random() * evs.length)];
            showModal(`🎲 เหตุการณ์ชะตากรรม: ${ev.title}`, `${ev.desc}<br><br><b>ผลลัพธ์:</b> ${ev.reward}`);
            if(ev.title.includes("เซียน")) game.stats.combat += 40;
            else game.stats.prestige += 60;
        }

        function bribeRival() {
            if (game.money >= 180) {
                game.money -= 180;
                game.rivals = ["ตระกูลคู่แข่งถูกซื้อสินบนและสงบศึกชั่วคราว"];
                showModal("เจรจาสงบศึกสำเร็จ", "ท่านใช้เงินติดสินบนและเจรจาขู่วิลาศ ทำให้ตระกูลคู่แข่งหยุดแผนการปองร้ายลงได้เปราะหนึ่ง");
            } else {
                showModal("เงินในคลังไม่พอ", "คลังเงินตระกูลไม่พอสำหรับการติดสินบนศัตรู!");
            }
            updateScreen();
        }

        // --- DUAL SAVE ENGINE (Auto & Manual Storage) ---
        function saveGame() {
            try {
                localStorage.setItem('dynasty_epic_master_ultimate_save_v2', JSON.stringify(game));
            } catch (e) {
                console.error("Critical Save Error:", e);
            }
        }

        function saveGameManually() {
            saveGame();
            showModal("บันทึกประวัติศาสตร์สำเร็จ", "บันทึกสถานะตระกูล ทรัพย์สิน และไทม์ไลน์ทั้งหมดลงในหน่วยความจำถาวรของเบราว์เซอร์เรียบร้อยแล้ว!");
        }

        function loadGame() {
            try {
                let saved = localStorage.getItem('dynasty_epic_master_ultimate_save_v2');
                if (saved) {
                    let loadedData = JSON.parse(saved);
                    game = { ...game, ...loadedData };
                }
            } catch (e) {
                console.error("Critical Load Error:", e);
            }
        }

        function resetGame() {
            if (confirm("คำเตือนระดับสูงสุด: คุณต้องการล้างข้อมูลและเริ่มต้นสร้างตระกูลใหม่ทั้งหมดใช่หรือไม่? ประวัติศาสตร์ พงศาวดาร และทรัพย์สินทั้งหมดจะสูญหายถาวร!")) {
                localStorage.removeItem('dynasty_epic_master_ultimate_save_v2');
                location.reload();
            }
        }

        // --- UI DRAWER & TOUCH-TO-CLOSE CONTROLLER ---
        function toggleDrawer(open) {
            let drawer = document.getElementById('left-drawer');
            let overlay = document.getElementById('drawer-overlay');
            if (open) {
                drawer.classList.add('active');
                overlay.classList.add('active');
            } else {
                drawer.classList.remove('active');
                overlay.classList.remove('active');
            }
        }

        function switchTab(tabName) {
            game.currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            let activeTab = document.getElementById('nav-' + tabName);
            if (activeTab) activeTab.classList.add('active');
            updateScreen();
        }

        // --- UNIVERSAL MODAL SYSTEM ---
        function showModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('game-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('game-modal').classList.remove('active');
        }

        // --- PREMIUM FEATURE MODALS (Pedigree, Shrine, Chronicle, Settings) ---
        function openModal(type) {
            toggleDrawer(false);
            
            if (type === 'pedigree') {
                showModal("📜 บันทึกพื้นเพตระกูลเชิงลึก", `
                    <b>นามสกุลตระกูล:</b> ${game.surname}<br>
                    <b>ชื่อจริงตัวละคร:</b> ${game.firstname}<br>
                    <b>ต้นกำเนิดชนชั้น:</b> ${game.origin}<br>
                    <b>ยศสูงสุดปัจจุบัน:</b> ${game.title}<br>
                    <b>ทายาทสืบสกุลในจวน:</b> ${game.family.heirs.length} คน<br>
                    <b>สถานะคลังเงิน:</b> ${game.money} ตำลึง<br>
                    <b>ชื่อเสียงตระกูล:</b> ${game.stats.prestige} แต้ม
                `);
            } else if (type === 'shrine') {
                showModal("⛩️ วิหารบรรพบุรุษ (Legacy Buffs)", `
                    ป้ายวิหารบรรพบุรุษจารึกเกียรติยศรุ่นสู่รุ่นของวงศ์ตระกูล ${game.surname}<br><br>
                    <b>Buff ส่งต่อลูกหลาน:</b> ${game.shrineBuffs}<br><br>
                    <i>ทุกครั้งที่มีการสืบทอดทายาทหรือผ่านพ้นรัชศก บัฟศักดิ์สิทธิ์นี้จะช่วยปกป้องคุ้มครองและเพิ่มพูนสเตตัสเริ่มต้นให้รุ่นถัดไปอย่างถาวร!</i>
                `);
            } else if (type === 'chronicle') {
                showModal("📖 ม้วนพงศาวดารชีวิตตระกูล", `
                    <b>มหากาพย์ประวัติศาสตร์และเกียรติยศตระกูล ${game.surname}:</b><br><br>
                    • ${game.chronicleLog.join('<br>• ')}
                `);
            } else if (type === 'settings') {
                let newSurname = prompt("เปลี่ยนนามสกุลตระกูล:", game.surname);
                let newFirst = prompt("เปลี่ยนชื่อจริงตัวละคร:", game.firstname);
                if (newSurname && newSurname.trim() !== "") game.surname = newSurname.trim();
                if (newFirst && newFirst.trim() !== "") game.firstname = newFirst.trim();
                updateScreen();
                saveGame();
                showModal("อัปเดตชื่อสำเร็จ", `เปลี่ยนชื่อเสียงเรียนามเป็น "${game.surname} ${game.firstname}" เรียบร้อยแล้ว`);
            }
        }

        // --- AUTO LOAD ON STARTUP ---
        window.onload = function() {
            loadGame();
            updateScreen();
        };
    </script>
</body>
</html>
